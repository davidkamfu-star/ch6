  <script>
  const diagramMigration='<div class="diagram"><svg viewBox="0 0 620 240" role="img" aria-label="Filter-paper ion migration experiment"><path d="M85 72h450v110H85z M85 72V35h145 M390 35h145v37" fill="none" stroke="#123a33" stroke-width="5"/><path d="M230 35h55 M335 35h55" stroke="#123a33" stroke-width="5"/><path d="M285 18v34 M300 24v22" stroke="#123a33" stroke-width="5"/><circle cx="95" cy="130" r="10" fill="#123a33"/><circle cx="525" cy="130" r="10" fill="#123a33"/><ellipse cx="300" cy="118" rx="22" ry="10" fill="#7b58a6"/><ellipse cx="300" cy="148" rx="22" ry="10" fill="#5290c5"/><text x="55" y="137" font-size="24">P</text><text x="545" y="137" font-size="24">Q</text><text x="125" y="212" font-size="17">filter paper moistened with Na₂SO₄(aq)</text></svg></div>';
  const diagramAcid='<div class="diagram"><svg viewBox="0 0 620 220" role="img" aria-label="Ion migration experiment with solution X"><path d="M110 70h400v105H110z M110 70V32h150 M360 32h150v38" fill="none" stroke="#123a33" stroke-width="5"/><path d="M260 32h45 M330 32h30" stroke="#123a33" stroke-width="5"/><path d="M305 16v32 M320 22v20" stroke="#123a33" stroke-width="5"/><circle cx="120" cy="125" r="10" fill="#e28a36"/><circle cx="500" cy="125" r="10" fill="#7b58a6"/><text x="75" y="132" font-size="24">P</text><text x="520" y="132" font-size="24">Q</text><text x="10" y="190" font-size="17">Na₂Cr₂O₇(s)</text><text x="480" y="190" font-size="17">KMnO₄(s)</text><text x="195" y="208" font-size="17">filter paper moistened with X</text></svg></div>';
  const diagramCell='<div class="diagram"><svg viewBox="0 0 620 245" role="img" aria-label="Conductivity test for sodium bromide powder"><path d="M155 65h310 M155 65v70h95 M370 135h95V65" fill="none" stroke="#123a33" stroke-width="5"/><path d="M290 45v40 M310 53v24" stroke="#123a33" stroke-width="5"/><circle cx="465" cy="100" r="17" fill="none" stroke="#123a33" stroke-width="4"/><path d="M250 125v80 M370 125v80 M240 205q65 28 140 0v-55H240z" fill="#c5b7a1" stroke="#123a33" stroke-width="4"/><text x="185" y="235" font-size="17">sodium bromide powder</text><text x="80" y="125" font-size="17">carbon electrode</text><text x="415" y="145" font-size="17">carbon electrode</text></svg></div>';
  const diagramP4='<div class="diagram"><svg viewBox="0 0 360 260" role="img" aria-label="Tetrahedral molecule of white phosphorus"><path d="M180 35L65 175L285 175Z M180 35L180 225L65 175 M180 225L285 175" fill="none" stroke="#123a33" stroke-width="5"/><g fill="#fffefa" stroke="#123a33" stroke-width="2"><circle cx="180" cy="35" r="22"/><circle cx="65" cy="175" r="22"/><circle cx="285" cy="175" r="22"/><circle cx="180" cy="225" r="22"/></g><g font-family="Georgia" font-size="25" text-anchor="middle"><text x="180" y="44">P</text><text x="65" y="184">P</text><text x="285" y="184">P</text><text x="180" y="234">P</text></g></svg></div>';
  const questions=[
  {r:'DSE/15/1A/15',p:60,t:'Which of the following statements concerning “atom” is correct?',o:['All atoms do not carry net charges.','Mass is evenly distributed within an atom.','All atoms consist of protons, neutrons and electrons.','For all elements, atoms of the same element have the same mass number.'],a:0,k:'Atoms are electrically neutral overall.',why:'An atom has equal numbers of protons and electrons, so it carries no net charge.',x:['B: Almost all mass is concentrated in the nucleus.','C: A protium atom, ¹H, has no neutron.','D: Isotopes of the same element have different mass numbers.'],tip:'An atom is neutral; an ion carries a net charge.'},
  {r:'DSE/14/1A/1',p:74,t:'Which of the following atoms has the smallest number of neutrons?',o:['⁶³Cu','⁵⁹Co','⁵⁸Ni','⁵⁷Fe'],a:2,k:'Number of neutrons = mass number − atomic number.',why:'Cu: 63−29=34; Co: 59−27=32; Ni: 58−28=30; Fe: 57−26=31. Nickel-58 has the fewest neutrons.',eq:'⁵⁸Ni: 58 − 28 = 30 neutrons',x:['A: 34 neutrons.','B: 32 neutrons.','D: 31 neutrons.'],tip:'Use the element’s atomic number, not the mass number, for protons.'},
  {r:'DSE/12/1A/15',p:63,t:'Which statements concerning a ¹³¹I atom and a ¹³¹Xe atom are correct?',e:'<div class="statements"><p>(1) They have the same number of protons.</p><p>(2) They have different numbers of neutrons.</p><p>(3) They have different numbers of outermost-shell electrons.</p></div>',o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:3,k:'Different elements have different proton and electron arrangements.',why:'I and Xe have the same mass number but different atomic numbers, so they have different neutron numbers. Their outermost-shell electron numbers also differ.',x:['(1) false: iodine and xenon have different atomic numbers.','(2) true: equal mass numbers but unequal proton numbers.','(3) true: iodine has 7 and xenon has 8 outermost-shell electrons.'],tip:'Same mass number does not mean same element.'},
  {r:'DSE/24/1A/16',p:76,t:'Consider ⁷⁴₃₂Ge, ⁷⁵₃₃As and ⁷⁶₃₄Se. Which statements are correct?',e:'<div class="statements"><p>(1) They have different numbers of protons.</p><p>(2) They have different numbers of neutrons.</p><p>(3) They have different numbers of outermost-shell electrons.</p></div>',o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:2,k:'Atomic number gives protons; group gives outermost-shell electrons.',why:'Their proton numbers are 32, 33 and 34. Each has 42 neutrons. Ge, As and Se have 4, 5 and 6 outermost-shell electrons.',eq:'74−32 = 75−33 = 76−34 = 42',x:['(1) true.','(2) false: all have 42 neutrons.','(3) true.'],tip:'For a set of nuclides, calculate each neutron number explicitly.'},
  {r:'DSE/13/1A/2',p:92,t:'Element X has only two isotopes, ⁶³X and ⁶⁵X. The graph shows their relative abundances. What is the relative atomic mass of X?',e:'<div class="diagram"><div class="bars"><div class="barcol" style="height:70%"><span>70%</span><b>⁶³X</b></div><div class="barcol" style="height:30%"><span>30%</span><b>⁶⁵X</b></div></div></div>',o:['63.3','63.5','63.6','64.0'],a:2,k:'Relative atomic mass is the abundance-weighted mean.',why:'Multiply each isotopic mass by its fractional abundance and add the results.',eq:'(63 × 0.70) + (65 × 0.30) = 63.6',x:['A and B underestimate the contribution of ⁶⁵X.','D would correspond to equal abundances.'],tip:'Check that percentage abundances add to 100% before calculating.'},
  {r:'DSE/13/1A/12',p:80,t:'Both radium and calcium are in the same group. Which statement is INCORRECT?',o:['Radium is a good conductor of electricity in the solid state.','Radium atoms readily donate electrons to form Ra²⁺ ions.','Both radium and calcium become tarnished after exposure to air.','Radium is less reactive than calcium.'],a:3,k:'Group II metals become more reactive down the group.',why:'Radium lies below calcium, so radium is more reactive, not less reactive.',x:['A true: radium is metallic.','B true: Group II atoms form 2+ ions.','C true: both react with substances in air.'],tip:'Down Group II, outer electrons are lost more readily.'},
  {r:'DSE/19/1A/1',p:92,t:'Which pair of atomic numbers corresponds to elements with similar chemical properties?',o:['4 and 14','8 and 18','9 and 35','19 and 38'],a:2,k:'Elements in the same group have similar chemical properties.',why:'Atomic numbers 9 and 35 have electronic arrangements 2,7 and 2,8,18,7. Both are Group VII elements.',x:['A: Groups II and IV.','B: Groups VI and 0.','D: Groups I and II.'],tip:'Write electronic arrangements and compare outermost-shell electrons.'},
  {r:'DSE/25/1A/1',p:70,t:'Which combination represents the numbers of subatomic particles of an anion?',e:'<div class="data-table"><table><tr><th></th><th>protons</th><th>neutrons</th><th>electrons</th></tr><tr><td>A</td><td>7</td><td>7</td><td>10</td></tr><tr><td>B</td><td>10</td><td>10</td><td>10</td></tr><tr><td>C</td><td>19</td><td>20</td><td>18</td></tr><tr><td>D</td><td>26</td><td>30</td><td>23</td></tr></table></div>',o:['7 protons, 7 neutrons, 10 electrons','10 protons, 10 neutrons, 10 electrons','19 protons, 20 neutrons, 18 electrons','26 protons, 30 neutrons, 23 electrons'],a:0,k:'An anion has more electrons than protons.',why:'Option A has three more electrons than protons, so the particle carries a 3− charge.',x:['B is neutral.','C has a 1+ charge.','D has a 3+ charge.'],tip:'Compare protons with electrons; neutrons do not affect charge.'},
  {r:'DSE/22/1A/2',p:71,t:'How many neutrons and electrons are in a ⁵¹₂₃X³⁺ ion?',o:['23 neutrons, 20 electrons','28 neutrons, 23 electrons','28 neutrons, 20 electrons','51 neutrons, 23 electrons'],a:2,k:'Mass number = protons + neutrons; a 3+ ion has lost 3 electrons.',why:'Neutrons = 51−23=28. A neutral X atom has 23 electrons, so X³⁺ has 20.',eq:'neutrons = 51−23 = 28; electrons = 23−3 = 20',x:['A uses atomic number as neutron number.','B does not remove electrons for the 3+ charge.','D uses mass number as neutron number.'],tip:'Ion formation changes electrons only, never protons or neutrons.'},
  {r:'DSE/16/1A/2',p:88,t:'Which electron diagram represents lithium sulphide? Only outermost-shell electrons are shown.',e:'<div class="diagram"><div class="electron-grid"><div><b>A</b><span>Li:S (shared-electron diagram)</span></div><div><b>B</b><span>[Li]⁺ [S]⁻</span></div><div><b>C</b><span>[Li]⁺ [ :S: ]²⁻ [Li]⁺</span></div><div><b>D</b><span>[ :Li: ]⁺ [ :S: ]²⁻ [ :Li: ]⁺</span></div></div></div>',o:['Diagram A','Diagram B','Diagram C','Diagram D'],a:2,k:'Lithium sulphide consists of two Li⁺ ions and one S²⁻ ion.',why:'Each Li atom loses one electron. Sulphur gains two electrons to complete an octet, giving Li₂S.',x:['A wrongly shows covalent sharing.','B has incorrect charges and ratio.','D wrongly shows outer-shell electrons remaining on Li⁺.'],tip:'For ionic diagrams, include brackets, charges and the correct ion ratio.'},
  {r:'DSE/13/1A/4',p:62,t:'Scandium nitrate is Sc(NO₃)₃. What is the most likely formula of scandium phosphate?',o:['Sc₂(PO₄)₃','ScPO₄','Sc(PO₄)₂','Sc(PO₄)₃'],a:1,k:'Ionic compounds are electrically neutral.',why:'Three nitrate ions show that scandium is Sc³⁺. Phosphate is PO₄³⁻, so they combine in a 1:1 ratio.',eq:'Sc³⁺ + PO₄³⁻ → ScPO₄',x:['A, C and D do not balance the 3+ and 3− charges in the simplest ratio.'],tip:'Infer an unknown ion charge from a known formula, then balance charges.'},
  {r:'DSE/15/1A/3',p:73,t:'Q is in Group II and forms Q₃R₂ with element R. Which group does R belong to?',o:['Group III','Group V','Group VI','Group VII'],a:1,k:'The total positive and negative charges in an ionic compound must balance.',why:'Three Q²⁺ ions contribute +6, so two R ions contribute −6 and each is R³⁻. An element forming a 3− ion belongs to Group V.',eq:'3(+2) + 2(−3) = 0',x:['Groups III, VI and VII typically form 3+, 2− and 1− ions respectively.'],tip:'Use the subscripts to balance total charge.'},
  {r:'DSE/17/1A/1',p:58,t:'X and Y form X₂Y. If the ions of X and Y have the same electronic arrangement, which compound may it be?',o:['lithium oxide','aluminium oxide','potassium sulphide','magnesium chloride'],a:2,k:'The formula must be X₂Y and the two ions must be isoelectronic.',why:'K₂S has the required formula. K⁺ and S²⁻ both have electronic arrangement 2,8,8.',x:['Li₂O has the right ratio but Li⁺ is 2 while O²⁻ is 2,8.','Al₂O₃ has the wrong ratio and ions are not isoelectronic.','MgCl₂ has the wrong X:Y ratio and unequal arrangements.'],tip:'Check both conditions: formula ratio and electron arrangement.'},
  {r:'DSE/22/1A/3',p:83,t:'Which of the following substances is an electrolyte?',o:['sodium chloride','silicon dioxide','methanol','mercury'],a:0,k:'An electrolyte conducts electricity when molten or in aqueous solution by mobile ions.',why:'Sodium chloride is ionic; its ions are mobile when molten or dissolved in water.',x:['Silicon dioxide is giant covalent.','Methanol is molecular and does not ionise appreciably.','Mercury conducts by electrons, so it is a conductor but not an electrolyte.'],tip:'A metal conductor is not automatically an electrolyte.'},
  {r:'DSE/23/1A/5',p:79,t:'What is observed after the circuit is closed for a period of time?',e:diagramMigration,o:['A purple patch and a blue patch migrate towards P.','A purple patch and a blue patch migrate towards Q.','A purple patch migrates towards P while a blue patch migrates towards Q.','A purple patch migrates towards Q while a blue patch migrates towards P.'],a:2,k:'Anions move to the positive electrode; cations move to the negative electrode.',why:'Purple MnO₄⁻ moves to positive electrode P. Blue Cu²⁺ moves to negative electrode Q.',x:['A and B send both ions in one direction.','D reverses the directions of both ions.'],tip:'Identify ion charge before using colour.'},
  {r:'DSE/19/1A/2',p:68,t:'What is observed after the circuit is closed for a period of time?',e:diagramAcid,o:['If X is dilute H₂SO₄, a purple patch migrates towards P.','If X is dilute H₂SO₄, an orange patch migrates towards Q.','If X is ethanol, a purple patch migrates towards P.','If X is ethanol, an orange patch migrates towards Q.'],a:0,k:'Ions migrate only through a conducting electrolyte.',why:'Dilute sulphuric acid conducts. Purple MnO₄⁻ is an anion and moves towards positive electrode P. Ethanol does not provide mobile ions.',x:['B sends negative Cr₂O₇²⁻ to the negative electrode.','C and D wrongly treat ethanol as an electrolyte.'],tip:'First decide whether the moistening liquid conducts; then determine direction.'},
  {r:'DSE/17/1A/16',p:66,t:'Which statements concerning helium are correct?',e:'<div class="statements"><p>(1) Helium is chemically inert.</p><p>(2) Helium exists as diatomic molecules.</p><p>(3) The outermost electron shell of a helium atom has an octet structure.</p></div>',o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:0,k:'Helium is inert because its first shell has a stable duplet.',why:'Helium is monatomic, not diatomic, and has 2 outermost-shell electrons rather than an octet.',x:['(1) true.','(2) false: helium exists as single atoms.','(3) false: helium has a duplet.'],tip:'Helium is the exception to the octet description of Group 0.'},
  {r:'DSE/22/1A/5',p:84,t:'X is one of the first twenty elements and forms a stable XH₄⁺(aq) ion. Which group does X most likely belong to?',o:['Group III','Group IV','Group V','Group VI'],a:2,k:'The ammonium-type XH₄⁺ ion is formed by a Group V hydride accepting H⁺.',why:'Among the first twenty elements, nitrogen forms the stable ammonium ion NH₄⁺. Nitrogen is in Group V.',x:['Groups III, IV and VI do not form the corresponding common stable XH₄⁺ ion in this context.'],tip:'Recognise NH₄⁺ as the familiar XH₄⁺ ion.'},
  {r:'DSE/18/1A/2',p:70,t:'Neon is a gas at room temperature and pressure because',o:['neon is chemically inert.','neon molecules are monatomic.','the attractive force between neon atoms is weak.','the outermost electron shell of a neon atom has an octet structure.'],a:2,k:'Physical state depends on interparticle attraction.',why:'Only weak van der Waals forces act between neon atoms, so little energy is needed to separate them.',x:['A and D explain low reactivity, not physical state.','B is inaccurate wording: neon exists as atoms, not molecules.'],tip:'For melting and boiling, focus on attractions between particles.'},
  {r:'DSE/23/1A/15',p:72,t:'Argon is a gas at room temperature and pressure because',o:['its outermost electron shell has an octet structure.','the attractive force between argon atoms is weak.','argon molecules are monatomic.','argon is chemically inert.'],a:1,k:'Weak interatomic attraction gives argon a low boiling point.',why:'Only weak van der Waals forces act between argon atoms, so argon remains gaseous at room temperature.',x:['A and D explain inertness.','C incorrectly calls argon atoms molecules.'],tip:'Chemical stability and physical state require different explanations.'},
  {r:'DSE/14/1A/2',p:75,t:'Which compound has a giant ionic structure?',o:['N₂O₄','HNO₃','NCl₃','NH₄NO₃'],a:3,k:'A lattice of cations and anions is a giant ionic structure.',why:'Ammonium nitrate consists of NH₄⁺ and NO₃⁻ ions arranged in an ionic lattice.',x:['N₂O₄, HNO₃ and NCl₃ are molecular covalent substances.'],tip:'Polyatomic ions can still form an ionic compound.'},
  {r:'DSE/12/1A/1',p:71,t:'Which substance CANNOT conduct electricity?',o:['Pt(s)','PbBr₂(l)','C(graphite)','CH₃CH₂OH(l)'],a:3,k:'Electrical conduction requires mobile charged particles.',why:'Liquid ethanol has neither mobile ions nor delocalised electrons.',x:['Solid platinum conducts by delocalised electrons.','Molten lead(II) bromide conducts by mobile ions.','Graphite conducts through delocalised electrons.'],tip:'For ionic compounds, always check the physical state.'},
  {r:'DSE/14/1A/20',p:63,t:'Which methods may light the bulb?',e:diagramCell+'<div class="statements"><p>(1) Heat the sodium bromide powder until molten.</p><p>(2) Add deionised water to the sodium bromide powder.</p><p>(3) Replace the powder with bromine liquid.</p></div>',o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:0,k:'Ionic compounds conduct when ions are mobile.',why:'Molten sodium bromide and aqueous sodium bromide contain mobile ions. Bromine liquid is molecular and lacks mobile charged particles.',x:['(1) true.','(2) true.','(3) false.'],tip:'A liquid does not necessarily conduct; ask whether it contains mobile charges.'},
  {r:'DSE/12/1A/8',p:94,t:'Silicon carbide has a crystal structure similar to diamond. Why is it very hard?',o:['It has a high melting point.','Silicon and carbon atoms form triple bonds.','It has a giant network structure with strong covalent bonds.','Both silicon and carbon atoms have four outermost-shell electrons.'],a:2,k:'Hardness of a giant covalent solid comes from strong bonds throughout the network.',why:'Many strong covalent bonds extend in all directions and must be broken to deform the solid.',x:['A is another consequence, not the cause of hardness.','B is false; the network does not consist of triple bonds.','D does not itself explain hardness.'],tip:'Link property → structure → bonding.'},
  {r:'DSE/20/1A/2',p:68,t:'Which statement concerning quartz is correct?',o:['Quartz is soluble in hexane.','Quartz consists of SiO₂ molecules.','Quartz conducts electricity by delocalised electrons.','Quartz is hard because it has a giant covalent network structure.'],a:3,k:'Quartz is a giant covalent solid.',why:'Strong Si–O covalent bonds extend throughout the network, making quartz hard.',x:['A: Giant covalent quartz is insoluble in hexane.','B: It has no discrete SiO₂ molecules.','C: It has no delocalised electrons.'],tip:'A formula such as SiO₂ can give a ratio, not a molecule.'},
  {r:'DSE/13/1A/1',p:70,t:'Which statement about silicon and silicon dioxide is correct?',o:['Silicon is a good conductor of heat.','Silicon exists as simple molecules.','SiO₂ is hard at room temperature.','SiO₂ dissolves in water to give an acidic solution.'],a:2,k:'Silicon dioxide has a giant covalent structure.',why:'Strong covalent bonds throughout its network make SiO₂ hard.',x:['A: Silicon is a semi-metal and poor heat conductor in this context.','B: Silicon has a giant covalent network.','D: SiO₂ is insoluble in water.'],tip:'Do not infer molecular structure from a short empirical formula.'},
  {r:'DSE/18/1A/5',p:80,t:'Why is quartz (SiO₂) harder than dry ice (CO₂)?',o:['Silicon atoms are larger than carbon atoms.','Silicon atoms have more electrons than carbon atoms.','Quartz has a giant network, but dry ice consists of discrete molecules.','The Si–O bond is strong, but the C–O bond is weak.'],a:2,k:'Quartz is giant covalent; dry ice is simple molecular.',why:'Deforming quartz requires breaking strong covalent bonds in a network. Melting or deforming dry ice mainly overcomes weak intermolecular forces.',x:['A and B do not explain the structural difference.','D is false: C=O bonds inside CO₂ molecules are strong.'],tip:'Compare bonds broken in the process, not merely bond strengths inside molecules.'},
  {r:'DSE/19/1A/24',p:78,t:'Mercury has good electrical conductivity at room temperature. Mercury has delocalised electrons. Choose the best answer.',o:['Both statements are true and the second correctly explains the first.','Both statements are true but the second does not explain the first.','The first is false but the second is true.','Both statements are false.'],a:0,k:'Metals conduct because delocalised electrons move through the structure.',why:'Mercury is a liquid metal at room temperature and its mobile delocalised electrons carry charge.',x:['B ignores the causal relationship.','C and D incorrectly deny mercury’s conductivity.'],tip:'In assertion–reason questions, test truth first, then causality.'},
  {r:'DSE/24/1A/1',p:79,t:'Which substance has delocalised electrons?',o:['NaCl(s)','Br₂(l)','Hg(l)','I₂(s)'],a:2,k:'Metallic structures contain delocalised electrons.',why:'Mercury is a metal even though it is liquid at room temperature.',x:['NaCl has localised ions in solid form.','Br₂ and I₂ are molecular substances.'],tip:'Physical state does not change whether an element is metallic.'},
  {r:'DSE/21/1A/21',p:81,t:'Which solids have delocalised electrons in their structures?',e:'<div class="statements"><p>(1) graphite</p><p>(2) silicon</p><p>(3) silver</p></div>',o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:2,k:'Graphite and metals contain mobile delocalised electrons.',why:'Each carbon in graphite contributes one delocalised electron; silver has metallic delocalised electrons. Silicon’s electrons are localised in covalent bonds.',x:['(1) true.','(2) false.','(3) true.'],tip:'Not every giant covalent solid conducts; graphite is the key exception.'},
  {r:'DSE/21/1A/1',p:60,t:'A species melts at 146 °C, dissolves in water, and its solution does not conduct electricity. Which structure would it have?',o:['giant ionic','giant metallic','giant covalent','simple molecular'],a:3,k:'Low melting point and a non-conducting solution indicate a molecular nonelectrolyte.',why:'A 146 °C melting point is relatively low. Dissolving without producing ions gives a non-conducting solution, consistent with simple molecules.',x:['An ionic substance would give a conducting aqueous solution.','Metallic and giant covalent structures generally do not fit the solubility and melting data.'],tip:'Use all three properties together.'},
  {r:'DSE/23/1A/18',p:70,t:'XBr and ZBr have the properties shown. Which statements are correct?',e:'<div class="data-table"><table><tr><th></th><th>Melting point / °C</th><th>Boiling point / °C</th><th>Solubility in water</th></tr><tr><td>XBr</td><td>459</td><td>1325</td><td>soluble</td></tr><tr><td>ZBr</td><td>32</td><td>105</td><td>insoluble</td></tr></table></div><div class="statements"><p>(1) XBr is a hard but brittle solid at room temperature.</p><p>(2) ZBr has a giant covalent structure.</p><p>(3) X is a metal and Z is a non-metal.</p></div>',o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:2,k:'Physical properties reveal ionic versus simple molecular structure.',why:'XBr’s high melting point and water solubility suggest ionic structure, so it is hard and brittle and X is a metal. ZBr’s low melting/boiling points indicate simple molecules and Z is a non-metal.',x:['(1) true.','(2) false: ZBr is simple molecular.','(3) true.'],tip:'High mp + water solubility often points to an ionic compound.'},
  {r:'DSE/25/1A/7',p:73,t:'Which statement about white phosphorus is correct?',e:diagramP4,o:['White phosphorus does not conduct electricity.','Its relative molecular mass is 31.0.','The attraction between its molecules is a covalent bond.','There is no lone pair on each phosphorus atom.'],a:0,k:'White phosphorus consists of discrete P₄ molecules without mobile charged particles.',why:'Each P forms three covalent bonds and retains one lone pair. There are no delocalised electrons, so white phosphorus does not conduct.',eq:'Mᵣ(P₄) = 4 × 31.0 = 124.0',x:['B forgets that the molecule is P₄.','C: molecules attract by van der Waals forces.','D: each P atom has one lone pair.'],tip:'Count atoms from the displayed molecular structure.'},
  {r:'DSE/26/1A/1',p:null,t:'A Group I element X reacts with a Group VI element Y to form Z. Which conductivity combination is correct?',e:'<div class="data-table"><table><tr><th></th><th>Z molten</th><th>Z aqueous</th></tr><tr><td>A</td><td>does not conduct</td><td>does not conduct</td></tr><tr><td>B</td><td>conducts</td><td>conducts</td></tr><tr><td>C</td><td>conducts</td><td>does not conduct</td></tr><tr><td>D</td><td>does not conduct</td><td>conducts</td></tr></table></div>',o:['Does not conduct when molten; does not conduct in aqueous solution.','Conducts when molten; conducts in aqueous solution.','Conducts when molten; does not conduct in aqueous solution.','Does not conduct when molten; conducts in aqueous solution.'],a:1,k:'A Group I metal and Group VI non-metal form an ionic compound.',why:'Z has mobile ions when molten and dissociates into mobile ions in aqueous solution, so both states conduct.',x:['A and D wrongly make molten Z non-conducting.','C wrongly makes aqueous Z non-conducting.'],tip:'Ionic compounds conduct whenever their ions are free to move.'},
  {r:'DSE/26/1A/14',p:null,t:'Which statements about Group 0 elements are correct?',e:'<div class="statements"><p>(1) Their boiling points increase down the group.</p><p>(2) None of them are present in air.</p><p>(3) All have eight electrons in the outermost shell.</p></div>',o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:0,k:'Van der Waals forces strengthen down Group 0.',why:'Boiling points increase down the group as atomic size and electron number increase. Noble gases are present in air, and helium has a stable duplet, not an octet.',x:['(1) true.','(2) false: argon and other noble gases occur in air.','(3) false because helium has two outermost-shell electrons.'],tip:'Remember helium as the Group 0 duplet exception.'}

  function render(){const q=questions[current],s=saved(current);selected=s?s.selected:null;el('pageTitle').textContent='Question '+(current+1);el('questionCount').textContent=(current+1)+' of '+questions.length;el('sourceTag').textContent=q.r;const d=q.p===null?'New · 2026':q.p>=75?'Easy · '+q.p+'% correct':q.p>=55?'Medium · '+q.p+'% correct':'Hard · '+q.p+'% correct';el('difficultyTag').textContent=d;el('questionTitle').innerHTML=q.t;el('questionExtra').innerHTML=q.e||'';el('options').innerHTML=q.o.map((o,i)=>{let c='option';if(s&&s.checked)c+=i===q.a?' correct':i===s.selected?' wrong':'';else if(selected===i)c+=' chosen';return '<button class="'+c+'" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+o+'</span></button>'}).join('');el('options').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));el('checkButton').disabled=selected===null||!!(s&&s.checked);el('checkButton').textContent=s&&s.checked?'Answer checked':'Check answer';el('clearButton').disabled=selected===null||!!(s&&s.checked);el('previousButton').disabled=current===0;el('nextButton').disabled=current===questions.length-1;marking();nav();summary();window.scrollTo({top:0,behavior:'smooth'})}

  el('checkButton').onclick=check;el('clearButton').onclick=()=>{delete state[current];localStorage.setItem(key,JSON.stringify(state));render()};el('previousButton').onclick=()=>go(current-1);el('nextButton').onclick=()=>go(current+1);el('resetButton').onclick=()=>{if(confirm('Reset all saved answers for Topic 02?')){state={};localStorage.removeItem(key);current=0;render()}};render();
