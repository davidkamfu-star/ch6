<script>
const qs=[{"r":"DSE/12/1A/27","p":60,"t":"In a 1 dm³ closed container, 1 mol of X₂(g) decomposes until equilibrium: X₂(g) ⇌ 2X(g). Which concentration–time graph is correct?","o":["Graph A","Graph B","Graph C","Graph D"],"a":0,"k":"Use the initial conditions and 1:2 stoichiometric change.","w":"Initially [X₂]=1 and [X]=0. If X₂ falls by x, X rises by 2x. Only graph A starts correctly and preserves this relationship as both curves level off.","d":"B and D violate the 1:2 change; C reverses the initially present and absent species.","tip":"Write an ICE change row before judging a graph.","img":["topic10-assets/q1-a.png","topic10-assets/q1-b.png","topic10-assets/q1-c.png","topic10-assets/q1-d.png"]},{"r":"DSE/22/1A/28","p":77,"t":"The graph shows [X] decreasing from 2.0 to 1.2 mol dm⁻³ while [Y] rises from 0 to 2.4 mol dm⁻³. Which equation fits?","o":["X(g) ⇌ 2Y(g)","X(g) ⇌ 3Y(g)","2X(g) ⇌ Y(g)","2X(g) ⇌ 3Y(g)"],"a":1,"k":"Read the coefficient ratio from concentration changes.","w":"Δ[X]=−0.8 and Δ[Y]=+2.4, so Y forms three times as fast as X is consumed: X ⇌ 3Y.","d":"The other equations do not give ΔY:−ΔX=3:1.","tip":"Use changes, not final concentrations.","img":["topic10-assets/q2-graph.png"]},{"r":"DSE/24/1A/26","p":86,"t":"The graph shows W falling by 0.10, Y falling by 0.20 and X rising by 0.20 mol dm⁻³. Which equation fits?","o":["2W + Y ⇌ 2X","2X ⇌ 2W + Y","W + 2Y ⇌ 2X","2X ⇌ 3W + Y"],"a":2,"k":"Concentration changes follow stoichiometric coefficients.","w":"The changes W:Y:X are −0.10:−0.20:+0.20=1:2:2, hence W+2Y ⇌ 2X.","d":"A has the wrong W:Y ratio; B and D place X on the wrong side.","tip":"Measure all vertical changes over the same interval.","img":["topic10-assets/q3-graph.png"]},{"r":"DSE/14/1A/35","p":80,"t":"1st statement: At equilibrium, the forward reaction rate equals zero.\n2nd statement: At equilibrium, reactants do not react to give products.","o":["Both statements are true and the 2nd statement correctly explains the 1st.","Both statements are true but the 2nd statement does not correctly explain the 1st.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":3,"k":"Equilibrium is dynamic.","w":"Forward and backward reactions continue at equal non-zero rates. Both statements are false.","d":"A–C accept at least one static-equilibrium misconception.","tip":"Remember: equal rates, constant concentrations, ongoing reactions."},{"r":"DSE/22/1A/36","p":79,"t":"1st statement: At equilibrium, reactant concentrations must equal product concentrations.\n2nd statement: At equilibrium, forward and backward rates are both zero.","o":["Both statements are true and the 2nd statement correctly explains the 1st.","Both statements are true but the 2nd statement does not correctly explain the 1st.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":3,"k":"Equal rates do not mean equal concentrations or zero rates.","w":"Equilibrium concentrations are constant but need not be equal. Both rates remain equal and non-zero.","d":"A–C accept one or both false claims.","tip":"Separate ‘equal’ from ‘constant’."},{"r":"DSE/17/1A/34","p":42,"t":"For 2CrO₄²⁻+2H⁺ ⇌ Cr₂O₇²⁻+H₂O, which statements are incorrect?\n(1) [CrO₄²⁻] must equal [Cr₂O₇²⁻].\n(2) Both reactions have stopped.\n(3) Moles CrO₄²⁻ must be double moles Cr₂O₇²⁻.","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":3,"k":"Coefficients control changes, not equilibrium amounts.","w":"Equilibrium concentrations are not fixed by coefficients, and both reactions continue. All three are incorrect.","d":"A–C each miss one false statement.","tip":"Coefficients give reaction ratios, not final mixture ratios."},{"r":"DSE/15/1A/31","p":61,"t":"At equilibrium COCl₂(g) ⇌ CO(g)+Cl₂(g), which statements are correct?\n(1) [CO] must equal [Cl₂].\n(2) Rate of COCl₂ decomposition equals rate of CO formation.\n(3) Kc increases when volume increases.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"Equilibrium requires equal forward and backward rates.","w":"Statement (2) is correct. Initial products can make [CO] and [Cl₂] unequal, and volume does not change Kc at fixed temperature.","d":"A and C assume equal concentrations; C and D wrongly change Kc.","tip":"Only temperature changes Kc."},{"r":"DSE/23/1A/29","p":56,"t":"HI ⇌ ½H₂+½I₂ has K₁; H₂+I₂ ⇌ 2HI has K₂. Which relationship is correct?","o":["K₁=1/K₂","K₁=1/K₂²","K₂=1/K₁","K₂=1/K₁²"],"a":3,"k":"Reverse to invert K; multiply coefficients to raise K to that power.","w":"Doubling the first equation gives K₁², then reversing gives K₂=1/K₁².","d":"A–C omit the square or reciprocal.","tip":"Track reversal and scaling separately."},{"r":"DSE/19/1A/26","p":69,"t":"CO+H₂O ⇌ CO₂+H₂ has Kc=0.8. What is Kc for the reverse reaction?","o":["0.8","1.25","0.8 mol⁻¹ dm³","1.25 mol⁻¹ dm³"],"a":1,"k":"Reverse reactions have reciprocal equilibrium constants.","w":"K=1/0.8=1.25. Equal total concentration powers mean no unit.","d":"A does not invert K; C and D attach an incorrect unit.","tip":"Check both value and unit."},{"r":"DSE/20/1A/26","p":65,"t":"K₁=1.3×10⁻³ for H₂A ⇌ H⁺+HA⁻ and K₂=3.1×10⁻⁶ for HA⁻ ⇌ H⁺+A²⁻. Find X for 2HA⁻ ⇌ H₂A+A²⁻.","o":["4.2×10²","2.4×10⁻³","4.0×10⁻⁹","2.5×10⁸"],"a":1,"k":"Combine equations algebraically.","w":"Reverse the first step and add the second: X=K₂/K₁=2.4×10⁻³.","d":"The alternatives multiply or invert the wrong ratio.","tip":"Write the target equation first."},{"r":"DSE/14/1A/26","p":68,"t":"A+B ⇌ C+D has K₁; C+D ⇌ E+F+G has K₂; E+F+G ⇌ A+B has K₃. Which is correct?","o":["K₃=1/(K₁K₂); mol dm⁻³","K₃=1/(K₁K₂); mol⁻¹ dm³","K₃=K₁K₂; mol dm⁻³","K₃=K₁K₂; mol⁻¹ dm³"],"a":1,"k":"Multiply successive equilibria, then invert for the return reaction.","w":"The first two give A+B ⇌ E+F+G with K₁K₂. Therefore K₃=1/(K₁K₂), with mol⁻¹ dm³.","d":"A has the wrong unit; C and D fail to invert.","tip":"Derive units from the final Kc expression."},{"r":"DSE/13/1A/27","p":61,"t":"For X₂+3Y₂ ⇌ 2XY₃ in 2.0 dm³, equilibrium amounts are 0.4, 0.3 and 0.4 mol. Find Kc.","o":["3.3","6.7","14.8","59.3"],"a":3,"k":"Convert amounts to concentrations.","w":"[X₂]=0.20, [Y₂]=0.15 and [XY₃]=0.20. Kc=0.20²/(0.20×0.15³)=59.3.","d":"A–C use moles directly or miss powers.","tip":"Box the Kc expression first."},{"r":"DSE/19/1A/27","p":78,"t":"In 3.0 dm³, equilibrium amounts are 0.10 mol HI, 0.60 mol H₂ and 0.60 mol I₂. For 2HI ⇌ H₂+I₂, find Kc.","o":["0.4","3.6","9.0","36.0"],"a":3,"k":"Use equilibrium concentrations and powers.","w":"Concentrations are 0.0333, 0.20 and 0.20. Kc=(0.20)(0.20)/(0.0333)²=36.0.","d":"The smaller values mix amounts with concentrations or miss the square.","tip":"[HI] must be squared."},{"r":"DSE/25/1A/29","p":53,"t":"For AgCl(s)+2NH₃ ⇌ [Ag(NH₃)₂]⁺+Cl⁻, Kc=3.60×10⁻³ and equilibrium [NH₃]=8.93×10⁻² mol dm⁻³. Find [Cl⁻].","o":["2.87×10⁻⁵","3.21×10⁻⁴","5.36×10⁻³","1.79×10⁻² mol dm⁻³"],"a":2,"k":"Omit pure AgCl; the products form equally.","w":"Let each product concentration be x. Kc=x²/(8.93×10⁻²)², so x=5.36×10⁻³.","d":"The alternatives miss a square root or power.","tip":"Pure solids are omitted from Kc."},{"r":"DSE/17/1A/31","p":56,"t":"For W+X ⇌ Y+Z, Kc=2.5. Initially 1.0 mol each of W and X are present with no products. How many moles of Y are at equilibrium?","o":["0.44","0.61","0.71","0.83"],"a":1,"k":"Build an ICE table.","w":"If x mol products form, Kc=x²/(1−x)²=2.5. Thus x/(1−x)=√2.5 and x=0.61 mol.","d":"The alternatives omit the square root or solve incorrectly.","tip":"Equal volumes cancel from this ratio."},{"r":"DSE/22/1A/30","p":65,"t":"0.40 mol SO₂ and 0.60 mol O₂ react in 1.0 dm³: 2SO₂+O₂ ⇌ 2SO₃. At equilibrium 0.30 mol SO₃ is present. Find Kc.","o":["20","6.7","2.0","0.050 mol⁻¹ dm³"],"a":0,"k":"Use stoichiometry to find remaining reactants.","w":"Forming 0.30 mol SO₃ consumes 0.30 SO₂ and 0.15 O₂. Kc=0.30²/(0.10²×0.45)=20 mol⁻¹ dm³.","d":"The other values use wrong remaining amounts or exponents.","tip":"Complete the ICE table first."},{"r":"DSE/15/1A/27","p":60,"t":"For 2XY₂ ⇌ X₂+2Y₂, Kc=0.60 mol dm⁻³. A 10.0 dm³ mixture contains 1.0 mol XY₂, 2.0 mol Y₂ and n mol X₂. Find n.","o":["1.5","3.0","0.15","0.30"],"a":0,"k":"Convert amounts to concentrations.","w":"Kc=(n/10)(0.20)²/(0.10)²=0.4n, so n=1.5 mol.","d":"Other options omit or invert volume and powers.","tip":"A vessel diagram supplies numerical data.","img":["topic10-assets/q17-vessel.png"]},{"r":"DSE/24/1A/30","p":49,"t":"CH₃COOH+C₂H₅OH ⇌ CH₃COOC₂H₅+H₂O. Initially 2.50 mol of each reactant; 0.85 mol acid remains. Find Kc.","o":["0.27","2.28","3.77","Cannot be determined without volume"],"a":2,"k":"Equal coefficients make volume cancel.","w":"Extent=1.65 mol. Kc=(1.65²)/(0.85²)=3.77.","d":"A inverts the ratio; B miscalculates; D overlooks cancellation.","tip":"For 1:1 ⇌ 1:1, mole ratios may be used."},{"r":"DSE/19/1A/25","p":66,"t":"For A+B ⇌ 2C, a small amount of B is added at time t at fixed volume and temperature. Which graph may represent [C]?","o":["Graph A","Graph B","Graph C","Graph D"],"a":2,"k":"[C] is continuous at t, then rises as equilibrium shifts right.","w":"No C is added, so [C] cannot jump. It rises gradually to a higher plateau: graph C.","d":"A and D show an impossible jump; B shifts in the wrong direction.","tip":"Only the directly added species jumps.","img":["topic10-assets/q19-a.jpg","topic10-assets/q19-b.jpg","topic10-assets/q19-c.jpg","topic10-assets/q19-d.jpg"]},{"r":"DSE/23/1A/27","p":30,"t":"For Fe³⁺+SCN⁻ ⇌ FeSCN²⁺, Fe(NO₃)₃ is added. At the new equilibrium, which pair is correct?","o":["Backward rate decreased; [FeSCN²⁺] unchanged","Backward rate decreased; [FeSCN²⁺] increased","Backward rate increased; [FeSCN²⁺] unchanged","Backward rate increased; [FeSCN²⁺] increased"],"a":3,"k":"Added Fe³⁺ shifts equilibrium toward the complex.","w":"More FeSCN²⁺ forms. Its higher concentration makes the new backward rate higher; forward and backward rates are again equal.","d":"A–C miss one of these effects.","tip":"Compare the two equilibrium states."},{"r":"DSE/14/1A/31","p":28,"t":"For 2SO₂+O₂ ⇌ 2SO₃, which statements are correct when volume decreases at constant temperature?\n(1) Kc increases.\n(2) Equilibrium shifts right.\n(3) SO₃ decomposition rate increases.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":3,"k":"Compression favours fewer gas molecules.","w":"Kc is unchanged. Equilibrium shifts right, while increased [SO₃] also raises its decomposition rate. Thus (2) and (3).","d":"A and C wrongly change Kc; B omits the increased backward rate.","tip":"Compression changes position and rates, not Kc."},{"r":"DSE/16/1A/26","p":60,"t":"CO+H₂O ⇌ CO₂+H₂, ΔH=−41.1 kJ mol⁻¹, is at equilibrium at fixed volume. Which is correct when temperature increases?","o":["Pressure remains unchanged","Both forward and backward rates increase","Kc remains unchanged","Yields of CO₂ and H₂ increase equally"],"a":1,"k":"Heating increases both reaction rates.","w":"Both rate constants increase. Pressure and Kc change, and the exothermic equilibrium shifts left rather than increasing products.","d":"A, C and D contradict the thermal response.","tip":"Heating affects kinetics and equilibrium."},{"r":"DSE/25/1A/36","p":60,"t":"1st statement: At fixed temperature, increasing reactant concentration changes Kc.\n2nd statement: It increases forward rate but decreases backward rate.","o":["Both statements are true and the 2nd statement correctly explains the 1st.","Both statements are true but the 2nd statement does not correctly explain the 1st.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":3,"k":"Concentration affects Q and rates, not Kc.","w":"Kc stays constant. Immediately after adding reactant, the forward rate rises while the backward rate is initially unchanged, not decreased. Both statements are false.","d":"A–C accept at least one false statement.","tip":"Separate immediate rates from later shifting."},{"r":"DSE/20/1A/33","p":29,"t":"H₂O ⇌ H⁺+OH⁻ is endothermic. Which are correct when pure water is heated from 25 to 50 °C?\n(1) [OH⁻] remains 1.0×10⁻⁷.\n(2) pH is below 7.\n(3) Water remains neutral.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":3,"k":"Neutral means [H⁺]=[OH⁻], not always pH 7.","w":"Heating shifts ionisation right. pH falls below 7, but equal H⁺ and OH⁻ keep the water neutral. (2) and (3) are correct.","d":"A and C retain the 25 °C concentration; B omits neutrality.","tip":"Neutral pH need not equal 7 away from 25 °C."},{"r":"DSE/25/1A/26","p":76,"t":"For SO₂+NO₂ ⇌ SO₃+NO, ΔH=−42 kJ mol⁻¹, which change increases equilibrium NO?","o":["Decrease temperature","Decrease volume","Add SO₃","Remove SO₂"],"a":0,"k":"Cooling favours the exothermic forward reaction.","w":"Lower temperature shifts right. Equal gas moles make volume ineffective; adding product or removing reactant shifts left.","d":"B has no position effect; C and D reduce NO.","tip":"Treat heat as a product for exothermic reactions."},{"r":"DSE/18/1A/26","p":71,"t":"Acetone+HCN ⇌ cyanohydrin has ΔH>0 at fixed volume. Which statement is correct?","o":["Adding product increases Kc","Increasing temperature increases product concentration","Reactant and product concentrations must be equal","After adding HCN its concentration returns exactly to the old value"],"a":1,"k":"Heating favours the endothermic forward reaction.","w":"Higher temperature shifts right. Composition does not change Kc; concentrations need not be equal; an addition is not completely cancelled.","d":"A, C and D are equilibrium misconceptions.","tip":"Use ΔH before considering composition."},{"r":"DSE/12/1A/35","p":60,"t":"1st statement: Increasing temperature can increase yield for all reversible reactions.\n2nd statement: Increasing temperature can shorten time to equilibrium for all reversible reactions.","o":["Both statements are true and the 2nd statement correctly explains the 1st.","Both statements are true but the 2nd statement does not correctly explain the 1st.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":2,"k":"Temperature raises rates but shifts yield according to ΔH.","w":"The first statement is false for exothermic forward reactions. The second is true because both directions speed up.","d":"A and B accept the universal yield claim; D rejects the kinetic effect.","tip":"Separate kinetics from thermodynamics."},{"r":"DSE/16/1A/27","p":72,"t":"Br₂(aq)+H₂O ⇌ HOBr+H⁺+Br⁻. Which addition makes the bromine colour paler?","o":["HCl(g)","HBr(g)","NaBr(s)","NaOH(s)"],"a":3,"k":"Remove H⁺ to shift toward colourless HOBr.","w":"NaOH removes H⁺, shifting right and consuming coloured Br₂.","d":"A–C add product ions and shift left.","tip":"Identify the coloured species first."},{"r":"DSE/17/1A/32","p":71,"t":"For W+X ⇌ Y+Z, ΔH=+45 kJ mol⁻¹, which increase equilibrium Y?\n(1) Remove Z.\n(2) Increase volume.\n(3) Increase temperature.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":2,"k":"Remove product or heat an endothermic reaction.","w":"Removing Z and heating shift right. Equal total coefficients make volume ineffective. Thus (1) and (3).","d":"A omits heating; B and D rely on volume.","tip":"Apply each change separately."},{"r":"DSE/21/1A/32","p":79,"t":"HA ⇌ H⁺+A⁻, ΔH>0; HA is colourless and A⁻ pink. Which statements are correct?\n(1) Na₂CO₃ makes it paler.\n(2) Heating makes it darker.\n(3) HCl increases [A⁻].","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"Darker means higher [A⁻].","w":"Carbonate removes H⁺ and actually shifts right; heating also shifts right; HCl shifts left. Only statement (2) is correct as worded.","d":"A/C accept the wrong carbonate colour; D accepts the wrong HCl effect.","tip":"Translate colour into concentration."},{"r":"DSE/24/1A/34","p":72,"t":"For PCl₅ ⇌ PCl₃+Cl₂, which increase equilibrium PCl₃?\n(1) Add catalyst.\n(2) Remove Cl₂.\n(3) Increase volume.","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":2,"k":"Remove product or lower pressure to favour more gas molecules.","w":"Removing Cl₂ and increasing volume shift right. A catalyst does not change composition.","d":"A/B include the catalyst; D includes all three.","tip":"Count gas coefficients."},{"r":"DSE/25/1A/27","p":68,"t":"For 2Y ⇌ Y₂, Kc=6.2 and Qc=4.5 at time t. Which is correct?","o":["System is at equilibrium","Forward rate is greater than backward rate","[Y₂] is 4.5 times [Y]","[Y] starts to increase"],"a":1,"k":"Compare Qc with Kc.","w":"Qc<Kc, so the system forms more Y₂ and the forward rate exceeds the backward rate.","d":"A confuses Q with K; C misses the square; D gives the wrong direction.","tip":"Qc<Kc means forward."},{"r":"DSE/21/1A/31","p":58,"t":"For 2X₃ ⇌ 3X₂, Kc=4.0 and Qc=2.0. Which are correct?\n(1) Forward rate exceeds backward.\n(2) Qc will decrease.\n(3) [X₂] must equal [X₃].","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":0,"k":"Qc below Kc drives the reaction forward.","w":"Forward rate is greater and Qc rises toward Kc. Equal concentrations are not required. Only (1).","d":"B/D give the wrong Q direction; C assumes equal concentrations.","tip":"State whether Q must rise or fall."},{"r":"DSE/23/1A/32","p":58,"t":"For X ⇌ Y, equilibrium X:Y=1:3. Which statements are correct?\n(1) Starting with X only, Q>K before equilibrium.\n(2) Starting with Y only gives the same equilibrium ratio.\n(3) At equilibrium backward rate is three times forward.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"At fixed temperature K fixes the ratio; equilibrium rates are equal.","w":"K=[Y]/[X]=3. Starting with X gives Q=0<K. Starting with Y reaches the same ratio, and rates are equal. Only (2).","d":"A/C reverse Q; C/D reject equal rates.","tip":"Equilibrium composition is path independent."},{"r":"DSE/26/1A/29","p":null,"t":"For 2SO₂+O₂ ⇌ 2SO₃, ΔH<0, what happens to SO₃ when (i) temperature rises at constant pressure and (ii) pressure rises at constant temperature?","o":["increase; decrease","increase; increase","decrease; increase","decrease; decrease"],"a":2,"k":"Heat favours reverse; pressure favours fewer gas molecules.","w":"Higher temperature shifts left and decreases SO₃. Higher pressure shifts right and increases SO₃.","d":"A, B and D apply one change incorrectly.","tip":"Treat the two disturbances independently."},{"r":"DSE/26/1A/31","p":null,"t":"Br₂+H₂O ⇌ HOBr+H⁺+Br⁻; HOBr is colourless. Which make the mixture paler?\n(1) Add KOH.\n(2) Pass HCl.\n(3) Add NaBr.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":0,"k":"Paler means less Br₂, so shift right.","w":"KOH removes H⁺ and shifts right. HCl and NaBr add product ions and shift left. Only (1).","d":"B–D include a product-ion addition.","tip":"Identify which side is coloured."},{"r":"DSE/26/1A/34","p":null,"t":"For 2A ⇌ B, 1.0 mol A and 0.1 mol B are initially mixed. Which graphs may represent the amounts as equilibrium is reached?","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":2,"k":"The invariant n(A)+2n(B) remains 1.2 mol.","w":"Graphs (1) and (3) satisfy A+2B=1.2 and approach equilibrium smoothly. Graph (2) violates the 2:1 mole-change relationship.","d":"B and D include impossible graph (2).","tip":"Check endpoints with a conserved combination.","img":["topic10-assets/q37-1.png","topic10-assets/q37-2.png","topic10-assets/q37-3.png"]}];
const key='chemical-equilibrium-progress-v1';let current=0,state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;const el=id=>document.getElementById(id),saved=i=>state[i]||null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=s=>esc(s).replace(/\n/g,'<br>');
function summary(){const done=Object.values(state).filter(v=>v&&v.checked),correct=done.filter(v=>v.selected===qs[v.index].a).length,pct=Math.round(done.length/qs.length*100);el('score').textContent=correct+'/'+done.length;el('progressText').textContent=pct+'% complete';el('progressBar').style.width=pct+'%'}
function nav(){el('questionNav').innerHTML=qs.map((q,i)=>{const s=saved(i);let c=i===current?'active ':'';if(s&&s.checked)c+=s.selected===q.a?'correct':'wrong';return '<button class="'+c.trim()+'" data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>'}).join('');el('questionNav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function render(){const q=qs[current],s=saved(current);selected=s?s.selected:null;el('pageTitle').textContent='Question '+(current+1);el('questionCount').textContent=(current+1)+' of '+qs.length;el('sourceTag').textContent=q.r;el('difficultyTag').textContent=q.p===null?'New · 2026':(q.p>=75?'Easy · ':q.p>=55?'Medium · ':'Hard · ')+q.p+'% correct';el('questionTitle').innerHTML=fmt(q.t);let extra=q.extra||'';if(q.img){const labels=current===36?q.img.map((_,i)=>'GRAPH ('+(i+1)+')'):q.img.length>1?q.img.map((_,i)=>'FIGURE '+String.fromCharCode(65+i)):['SOURCE DIAGRAM'];extra+='<div class="source-stack">'+q.img.map((src,i)=>'<button type="button" class="diagram-button" data-src="'+src+'" data-label="'+labels[i]+'" aria-label="Enlarge '+labels[i]+'"><span class="figure-label">'+labels[i]+'</span><img class="source-visual" src="'+src+'" alt="Source diagram for question '+(current+1)+' '+labels[i]+'"><span class="tap-zoom">Tap to enlarge ↗</span></button>').join('')+'</div>';}el('questionExtra').innerHTML=extra;el('questionExtra').querySelectorAll('.diagram-button').forEach(b=>b.onclick=()=>openDiagram(b.dataset.src,b.dataset.label));el('options').innerHTML=q.o.map((o,i)=>{let c='option';if(s&&s.checked)c+=i===q.a?' correct':i===s.selected?' wrong':'';else if(selected===i)c+=' chosen';return '<button class="'+c+'" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+fmt(o)+'</span></button>'}).join('');el('options').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));el('checkButton').disabled=selected===null||!!(s&&s.checked);el('checkButton').textContent=s&&s.checked?'Answer checked':'Check answer';el('clearButton').disabled=selected===null||!!(s&&s.checked);el('previousButton').disabled=current===0;el('nextButton').disabled=current===qs.length-1;marking();nav();summary();window.scrollTo({top:0,behavior:'smooth'})}
function choose(i){selected=i;state[current]={index:current,selected:i,checked:false};localStorage.setItem(key,JSON.stringify(state));render()}function check(){if(selected===null)return;state[current]={index:current,selected,checked:true};localStorage.setItem(key,JSON.stringify(state));render()}function go(i){current=Math.max(0,Math.min(qs.length-1,i));render()}
function marking(){const q=qs[current],s=saved(current);if(!s||!s.checked){el('markingPanel').innerHTML='<div class="locked"><span>✓</span><h3>Detailed marking</h3><p>Select an option and check your answer to reveal the key principle, reasoning and distractor analysis.</p></div>';return}const ok=s.selected===q.a;el('markingPanel').innerHTML='<div class="explanation"><div class="answer-status '+(ok?'yes':'no')+'">'+(ok?'Correct · 1/1 mark':'Not correct · 0/1 mark')+'</div><p class="answer-label">CORRECT ANSWER · '+String.fromCharCode(65+q.a)+'</p><h3 class="result-title">'+fmt(q.k)+'</h3><h4>DETAILED MARKING</h4><p>'+fmt(q.w)+'</p><h4>DISTRACTOR ANALYSIS</h4><p>'+fmt(q.d)+'</p><div class="tip"><b>EXAM TIP</b><p>'+fmt(q.tip)+'</p></div></div>'}
function openDiagram(src,label){const viewer=el('diagramViewer'),img=el('diagramViewerImage');img.src=src;img.alt='Enlarged '+label+' for question '+(current+1);el('diagramViewerLabel').textContent='QUESTION '+(current+1)+' · '+label;viewer.classList.add('open');document.body.style.overflow='hidden'}function closeDiagram(){el('diagramViewer').classList.remove('open');el('diagramViewerImage').src='';document.body.style.overflow=''}el('diagramClose').onclick=closeDiagram;el('diagramViewer').onclick=e=>{if(e.target===el('diagramViewer'))closeDiagram()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDiagram()});
el('checkButton').onclick=check;el('clearButton').onclick=()=>{delete state[current];localStorage.setItem(key,JSON.stringify(state));render()};el('previousButton').onclick=()=>go(current-1);el('nextButton').onclick=()=>go(current+1);el('resetButton').onclick=()=>{if(confirm('Reset all saved answers for Topic 08?')){state={};localStorage.removeItem(key);current=0;render()}};render();
</script><script src="student-tools.js?v=20260826a"></script></body></html>
