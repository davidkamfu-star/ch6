const qs=[
{r:'DSE/20/1A/7',p:54,t:'Refer to the table. Which is the best material for an aircraft body?',e:table(['Material','Hardness rank (1 = hardest)','Density / g cm⁻³','Price rank (1 = cheapest)'],[['P','4','8.9','4'],['Q','3','7.8','1'],['R','2','10.5','3'],['S','1','2.7','2']]),o:['P','Q','R','S'],a:3,k:'Aircraft materials should combine low density with high hardness.',w:'S has the lowest density and is the hardest of the four materials, while its price rank is still acceptable.',d:'P, Q and R are all denser and less hard than S.',tip:'Use every stated design criterion, not price alone.'},
{r:'DSE/13/1A/5',p:71,t:'Which method can obtain magnesium from magnesium compounds?',o:['Electrolysis of a molten magnesium compound','Electrolysis of an aqueous magnesium compound','Heating magnesium oxide with carbon','Strongly heating magnesium oxide'],a:0,k:'Very reactive metals are extracted by electrolysis of molten compounds.',w:'Magnesium is above carbon in the reactivity series. In aqueous electrolysis, water is reduced instead of Mg²⁺; a molten compound is required.',d:'Carbon cannot reduce MgO, and MgO does not decompose to magnesium on heating.',tip:'Metals above carbon require molten electrolysis.'},
{r:'DSE/19/1A/17',p:81,t:'Which metal oxides can be reduced to metals by heating with carbon using a Bunsen burner?',e:st(['lead(II) oxide','magnesium oxide','copper(II) oxide']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:2,k:'Carbon reduces oxides of metals below carbon in the reactivity series.',w:'Lead and copper are less reactive than carbon, but magnesium is more reactive and its oxide is too stable.',d:'Any choice containing magnesium oxide is incorrect.',tip:'Compare each metal with carbon in the reactivity series.'},
{r:'DSE/14/1A/14',p:68,t:'The glowing splint relights when solid Z is heated. Which chemical may Z be?',e:vis(img.q04,'Solid Z heated while a glowing splint tests the gas'),o:['HgO','Al₂O₃','CaCO₃','MgCO₃'],a:0,k:'A relit glowing splint identifies oxygen.',w:'Mercury(II) oxide decomposes on heating to mercury and oxygen gas.',eq:'2HgO(s) → 2Hg(l) + O₂(g)',d:'Al₂O₃ is thermally stable; CaCO₃ and MgCO₃ release carbon dioxide.',tip:'Identify the gas first, then choose the matching decomposition.'},
{r:'DSE/17/1A/9',p:72,t:'Which process would NOT produce a metal?',o:['Heating zinc oxide','Heating copper(II) oxide with carbon','Electrolysis of molten lithium chloride','Heating iron(III) oxide with carbon monoxide'],a:0,k:'Zinc oxide does not decompose to zinc by heating alone.',w:'ZnO needs a reducing agent such as carbon, carbon monoxide or hydrogen. The other processes produce Cu, Li and Fe respectively.',d:'B, C and D are valid extraction or reduction processes.',tip:'Heating alone only works for oxides of very unreactive metals.'},
{r:'DSE/18/1A/3',p:78,t:'Ag₂O is strongly heated. Which graph shows the mass of the test-tube contents against time?',e:'<div class="diagram"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:center"><div><b>A</b><svg viewBox="0 0 160 100"><path d="M25 10v70h125M25 75L135 20" fill="none" stroke="#123a33" stroke-width="3"/></svg></div><div><b>B</b><svg viewBox="0 0 160 100"><path d="M25 10v70h125M25 70L100 25h35" fill="none" stroke="#123a33" stroke-width="3"/></svg></div><div><b>C</b><svg viewBox="0 0 160 100"><path d="M25 10v70h125M25 30h110" fill="none" stroke="#123a33" stroke-width="3"/></svg></div><div><b>D</b><svg viewBox="0 0 160 100"><path d="M25 10v70h125M25 20L100 65h35" fill="none" stroke="#123a33" stroke-width="3"/></svg></div></div></div>',o:['Graph A','Graph B','Graph C','Graph D'],a:3,k:'Mass decreases then becomes constant when decomposition finishes.',w:'Ag₂O forms Ag and O₂. Oxygen escapes, lowering the measured mass until no Ag₂O remains.',eq:'2Ag₂O(s) → 4Ag(s) + O₂(g)',d:'A and B increase; C ignores the escaping gas.',tip:'For open-system heating, check whether a gaseous product escapes.'},
{r:'DSE/14/1A/18',p:66,t:'Potassium is added to water containing phenolphthalein. Which statements are correct?',e:st(['An exothermic reaction occurs.','A colourless solution is formed.','The metal burns with a lilac flame.']),o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:1,k:'Potassium reacts vigorously and exothermically with water.',w:'The heat may ignite potassium/hydrogen with a lilac flame. KOH forms, so phenolphthalein turns pink; statement (2) is false.',d:'Only statements (1) and (3) are correct.',tip:'Phenolphthalein is pink in alkaline solution.'},
{r:'DSE/22/1A/20',p:91,t:'Sodium is added to water containing universal indicator. Which statements are correct?',e:st(['Sodium moves quickly on the water surface.','The resulting solution is red.','The reaction is exothermic.']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:2,k:'Sodium forms an alkaline solution in an exothermic reaction.',w:'Sodium moves on the surface and releases heat. NaOH makes universal indicator blue/purple, not red.',d:'Statement (2) is false; (1) and (3) are true.',tip:'Group I metal + water gives alkaline hydroxide + hydrogen.'},
{r:'DSE/15/1A/21',p:55,t:'What is observed when calcium granules are placed in cold water?',e:st(['A cloudy mixture forms.','The test tube becomes warm.','Colourless gas bubbles form.']),o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:3,k:'Calcium reacts exothermically with water to form Ca(OH)₂ and H₂.',w:'Slightly soluble Ca(OH)₂ makes the mixture cloudy; heat is released and colourless hydrogen bubbles form.',eq:'Ca(s) + 2H₂O(l) → Ca(OH)₂(aq/s) + H₂(g)',d:'All three observations are expected.',tip:'Slight solubility of calcium hydroxide explains the cloudiness.'},
{r:'DSE/14/1A/19',p:38,t:'A system contains 40 cm³ N₂, 25 cm³ O₂ and 10 cm³ He. Excess heated copper is contacted with the gases. Which statements are correct?',e:vis(img.q10,'Gas syringes pass gases over heated excess copper powder')+st(['Some copper becomes black.','Total gas volume decreases by 25 cm³.','Replacing copper with excess iron gives the same volume decrease.']),o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:3,k:'Heated copper or iron removes oxygen from the gas mixture.',w:'Copper forms black CuO. All 25 cm³ of O₂ is consumed, so volume falls by 25 cm³. Excess iron also consumes all oxygen.',d:'All three statements follow from complete oxygen removal.',tip:'At equal conditions, gas-volume change equals the volume of gas consumed.'},
{r:'DSE/16/1A/4',p:75,t:'In the steam experiment shown, which metal would NOT be X?',e:vis(img.q11,'Steam passed over a strongly heated metal and hydrogen collected'),o:['iron','zinc','copper','magnesium'],a:2,k:'Copper does not react with steam.',w:'Magnesium, zinc and iron can reduce steam to hydrogen under suitable heating, but copper is below hydrogen in the reactivity series.',d:'A, B and D can produce hydrogen in this setup.',tip:'Metals below hydrogen do not displace hydrogen from water or steam.'},
{r:'DSE/16/1A/3',p:59,t:'Y reacts vigorously with water, forms Y₂O, and has five occupied electron shells. What may Y be?',o:['silver','caesium','strontium','rubidium'],a:3,k:'Y is a Period 5 Group I metal.',w:'Y₂O indicates Y⁺, vigorous reaction with water indicates Group I, and five occupied shells indicate Period 5: rubidium.',d:'Cs is Period 6; Sr forms SrO; Ag does not react vigorously with water.',tip:'Use formula, reactivity and period information together.'},
{r:'DSE/22/1A/12',p:91,t:'For xNH₃(g) + yO₂(g) → xNO(g) + zH₂O(g), which coefficients are correct?',o:['x=2, y=3, z=3','x=2, y=3, z=6','x=4, y=5, z=4','x=4, y=5, z=6'],a:3,k:'Balance each element without changing formulae.',w:'Balancing N, H then O gives 4NH₃ + 5O₂ → 4NO + 6H₂O.',eq:'4NH₃(g) + 5O₂(g) → 4NO(g) + 6H₂O(g)',d:'Only D conserves N, H and O simultaneously.',tip:'Balance oxygen last when it appears in several products.'},
{r:'DSE/25/1A/9',p:74,t:'For xH₂S + 2KMnO₄ + 3H₂SO₄ → xS + yH₂O + zMnSO₄ + K₂SO₄, which x and y are correct?',o:['x=3, y=6','x=5, y=8','x=5, y=10','x=7, y=10'],a:1,k:'Balance atoms systematically.',w:'Mn gives z=2. Oxygen then gives y=8, and hydrogen gives x=5.',eq:'5H₂S + 2KMnO₄ + 3H₂SO₄ → 5S + 8H₂O + 2MnSO₄ + K₂SO₄',d:'The other pairs fail atom conservation.',tip:'Use an element appearing in only one species on each side first.'},
{r:'DSE/24/1A/21',p:81,t:'Which statements show that Y is more reactive than gold?',e:st(['Y reacts with dilute HCl while gold does not.','Y displaces copper from Cu(NO₃)₂ while gold does not.','Gold can be extracted physically from its ore while Y cannot.']),o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:3,k:'Reaction, displacement and extraction evidence can compare reactivity.',w:'Each observation places Y above gold: Y is above hydrogen, Y is above copper while gold is below it, and gold occurs native more readily than Y.',d:'All three are valid comparative evidence.',tip:'Translate each observation into a reactivity-series position.'},
{r:'DSE/15/1A/14',p:79,t:'Which metal W, X, Y or Z has the lowest reactivity?',e:st(['Heating W oxide gives W.','Heating X in steam gives a colourless gas.','Putting Y in CH₃CO₂H gives a colourless gas.','Putting Z in CuSO₄ gives a reddish-brown solid.']),o:['W','X','Y','Z'],a:0,k:'An oxide decomposed by heat alone belongs to a very unreactive metal.',w:'W may be silver or mercury. X reacts with steam, Y with acid, and Z displaces copper, so all X, Y and Z are more reactive.',d:'The evidence for X, Y and Z places them above hydrogen or copper.',tip:'The easier an oxide is reduced, the less reactive the metal.'},
{r:'DSE/18/1A/9',p:59,t:'Only Y reacts in NaCl(aq), and only oxide X releases a gas on strong heating. What is the decreasing reactivity order?',o:['Y > Z > X','X > Y > Z','Y > X > Z','Z > Y > X'],a:0,k:'Reaction with water identifies the most reactive; easy oxide decomposition identifies the least reactive.',w:'Y reacts with water and is most reactive. X oxide decomposes most readily, so X is least reactive. Therefore Y > Z > X.',d:'The other orders conflict with one of the two observations.',tip:'Convert each test into a “most” or “least” statement first.'},
{r:'DSE/21/1A/4',p:65,t:'Only oxide M gives a metallic lustre on heating; only carbonate R shows no change. What is the increasing reactivity order?',o:['R < Q < M','R < M < Q','M < R < Q','M < Q < R'],a:3,k:'More reactive metals form more thermally stable compounds.',w:'M oxide decomposes to metal, so M is least reactive. R carbonate is most stable, so R is most reactive. Hence M < Q < R.',d:'All other sequences reverse one of these deductions.',tip:'Compound stability generally increases with metal reactivity.'},
{r:'DSE/20/1A/15',p:54,t:'From the heating observations, what is the decreasing reactivity order?',e:table(['Metal carbonate','Observation'],[['X₂CO₃','Gas + shiny silvery solid'],['Y₂CO₃','No observable change'],['ZCO₃','Gas + yellow solid']]),o:['Z > Y > X','Y > X > Z','Z > X > Y','Y > Z > X'],a:3,k:'Thermally stable carbonates belong to more reactive metals.',w:'Y₂CO₃ is unchanged, so Y is most reactive. X₂CO₃ gives metal directly, so X is least reactive. Z is intermediate: Y > Z > X.',d:'The yellow solid from ZCO₃ is a metal oxide, not metal.',tip:'Metal product indicates an especially unstable compound.'},
{r:'DSE/18/1A/4',p:60,t:'If 8.0 g SO₂ contains n molecules, how many molecules are in 2.0 g O₂?',o:['2.0n','4.0n','0.25n','0.50n'],a:3,k:'Number of molecules is proportional to moles.',w:'8.0/64.0 = 0.125 mol SO₂, while 2.0/32.0 = 0.0625 mol O₂, half as many moles and molecules.',eq:'0.0625 / 0.125 = 0.50',d:'The other ratios arise from comparing masses without molar masses.',tip:'Convert each sample to moles before comparing particle numbers.'},
{r:'DSE/23/1A/4',p:88,t:'Which fertiliser has the highest percentage by mass of nitrogen?',e:table(['Fertiliser','Molar mass / g mol⁻¹'],[['(NH₂)₂CO','60.0'],['NH₄NO₃','80.0'],['NaNO₃','85.0'],['(NH₄)₂SO₄','132.1']]),o:['(NH₂)₂CO','NH₄NO₃','NaNO₃','(NH₄)₂SO₄'],a:0,k:'Percentage by mass = nitrogen mass per mole ÷ molar mass × 100%.',w:'Urea contains 28.0 g nitrogen per 60.0 g: 46.7%, higher than the other fertilisers.',eq:'%N in (NH₂)₂CO = 28.0/60.0 × 100% = 46.7%',d:'NH₄NO₃ is 35.0%; NaNO₃ is 16.5%; (NH₄)₂SO₄ is about 21.2%.',tip:'Count every nitrogen atom before dividing by molar mass.'},
{r:'DSE/12/1A/9',p:81,t:'Which statement about an aluminium ore consisting mainly of Al₂O₃ is correct?',o:['Carbon can extract aluminium from it.','Its abundance in the crust is very low.','It contains more than 55% aluminium by mass.','Aluminium extraction became possible through applying electricity.'],a:3,k:'Aluminium is extracted by electrolysis, enabled by electrical technology.',w:'Aluminium is too reactive for carbon reduction. Aluminium ores are abundant, and Al₂O₃ contains about 52.9% Al, not more than 55%.',eq:'%Al = 54/(54+48) × 100% ≈ 52.9%',d:'A, B and C contradict reactivity, abundance or composition data.',tip:'High-reactivity metals require electrolysis.'},
{r:'DSE/20/1A/3',p:82,t:'What is the mass of oxygen in 24.0 g of CuSO₄·5H₂O?',o:['6.2 g','9.6 g','13.8 g','21.7 g'],a:2,k:'Count oxygen in both the sulphate ion and water of crystallisation.',w:'The hydrate has 9 oxygen atoms per formula unit. Its molar mass is 249.6 g mol⁻¹, and oxygen contributes 144.0 g.',eq:'24.0 × 144.0/249.6 = 13.8 g',d:'Smaller values omit some oxygen atoms; 21.7 g overcounts oxygen.',tip:'A dot formula includes atoms on both sides of the dot.'},
{r:'DSE/14/1A/5',p:84,t:'Hydrated salt X·nH₂O contains 51.16% water. M(X)=120.3 g mol⁻¹. What is n?',o:['2','5','7','10'],a:2,k:'Set the water mass fraction equal to the given percentage.',w:'18n/(120.3+18n)=0.5116 gives n≈7.',eq:'18n/(120.3 + 18n) = 0.5116 → n = 7',d:'The other n values give different water percentages.',tip:'Include the water mass in the total molar mass denominator.'},
{r:'DSE/19/1A/8',p:82,t:'39.2 g of a rubidium oxide contains 28.5 g Rb. What is its empirical formula?',o:['RbO','RbO₂','Rb₂O','Rb₂O₂'],a:1,k:'Empirical formula comes from the simplest mole ratio.',w:'O mass is 10.7 g. Moles: Rb=28.5/85.5=0.333; O=10.7/16=0.669, giving Rb:O≈1:2.',eq:'Rb : O = 0.333 : 0.669 ≈ 1 : 2',d:'The other formulae have incompatible Rb:O ratios.',tip:'Subtract to find the oxygen mass first.'},
{r:'DSE/13/1A/13',p:74,t:'2.66 g titanium forms 4.44 g oxide. What is the empirical formula?',o:['TiO','Ti₂O₃','Ti₃O₄','TiO₂'],a:3,k:'Use moles of metal and gained oxygen.',w:'O mass=1.78 g. Ti=2.66/47.9=0.0555 mol; O=1.78/16=0.111 mol, a 1:2 ratio.',eq:'Ti : O = 0.0555 : 0.111 = 1 : 2',d:'A, B and C correspond to lower oxygen ratios.',tip:'Mass gain during oxidation is the oxygen mass.'},
{r:'DSE/23/1A/6',p:70,t:'2.21 g oxide of X is heated; 1.97 g metal remains. Ar(X)=197. What is the oxide formula?',o:['XO','XO₂','X₂O','X₂O₃'],a:3,k:'Find moles of remaining metal and oxygen lost.',w:'X=1.97/197=0.0100 mol. O=(2.21−1.97)/16=0.0150 mol. X:O=2:3.',eq:'0.0100 : 0.0150 = 2 : 3 → X₂O₃',d:'Other choices have different mole ratios.',tip:'The lost mass is oxygen because the oxide decomposes to metal.'},
{r:'DSE/12/1A/3',p:78,t:'An oxide contains 55.0% metal M by mass. Ar(M)=39.1. What is its formula?',o:['MO₂','M₂O','M₂O₂','M₂O₃'],a:0,k:'Assume 100 g and convert each element mass to moles.',w:'M: 55/39.1=1.406 mol; O:45/16=2.813 mol. The ratio is 1:2.',eq:'M : O = 1.406 : 2.813 = 1 : 2',d:'B, C and D do not match the calculated ratio.',tip:'A 100 g basis turns percentages directly into grams.'},
{r:'DSE/17/1A/3',p:43,t:'A hydrocarbon gives 17.6 g CO₂ and 3.6 g H₂O on complete combustion. What is its empirical formula?',o:['CH','CH₂','C₂H₂','C₂H₅'],a:0,k:'Combustion products reveal moles of C and H atoms.',w:'17.6/44=0.400 mol C. 3.6/18=0.200 mol H₂O=0.400 mol H atoms. C:H=1:1.',eq:'C : H = 0.400 : 0.400 = 1 : 1',d:'C₂H₂ simplifies to CH, so the empirical formula is A.',tip:'Empirical formula must be in the simplest whole-number ratio.'},
{r:'DSE/25/1A/13',p:65,t:'30.00 g W burns to give 33.75 g H₂O and 41.25 g CO₂. Which compound may W be?',o:['HCOOH','CH₂=CHCOOH','CH₃OH','CH₂(OH)CH₂OH'],a:2,k:'Combustion analysis gives the empirical composition.',w:'C mass=11.25 g, H mass=3.75 g and O mass=15.00 g. Mole ratio C:H:O=1:4:1, matching CH₃OH.',eq:'C:H:O = 0.9375:3.75:0.9375 = 1:4:1',d:'The other molecular formulae do not have empirical formula CH₄O.',tip:'Find oxygen in W by mass difference.'},
{r:'DSE/21/1A/19',p:55,t:'X is 26.8% by mass in K₂XO₄. Which statements about X are correct?',e:st(['X is a transition metal.','X is in Group VI.','X is in Period 4.']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:2,k:'The percentage composition identifies X as chromium.',w:'Solving x/(78.2+x+64)=0.268 gives Ar(X)≈52.0, chromium. Cr is a Period 4 transition metal; the syllabus group statement (2) is not accepted here.',eq:'x/(142.2+x)=0.268 → x≈52.0',d:'Statements (1) and (3) are correct.',tip:'Determine the element before applying periodic-table classifications.'},
{r:'DSE/14/1A/4',p:62,t:'N mol Fe₂O₃ reacts with 2N mol CO: Fe₂O₃ + 3CO → 2Fe + 3CO₂. How many moles Fe form?',o:['N','2N','2N/3','4N/3'],a:3,k:'Identify the limiting reagent using the mole ratio.',w:'2N mol CO can react with 2N/3 mol Fe₂O₃. This forms twice as many moles of Fe: 4N/3.',eq:'2N CO × (2 mol Fe / 3 mol CO) = 4N/3 mol Fe',d:'Fe₂O₃ is in excess; answers based on all N mol reacting are incorrect.',tip:'The smaller stoichiometric amount determines product yield.'},
{r:'DSE/24/1A/3',p:54,t:'What theoretical mass of H₂ forms when 13.50 g Al reacts with excess dilute HCl?',o:['0.67 g','0.75 g','1.00 g','1.50 g'],a:3,k:'Use the balanced equation and mole ratio.',w:'13.50/27.0=0.500 mol Al. From 2Al→3H₂, this gives 0.750 mol H₂=1.50 g.',eq:'2Al + 6HCl → 2AlCl₃ + 3H₂',d:'Other values use incorrect Al:H₂ ratios or hydrogen molar mass.',tip:'H₂ has molar mass 2.0 g mol⁻¹.'},
{r:'DSE/24/1A/6',p:67,t:'2M(NO₃)₂ → 2MO + 4NO₂ + O₂. A 0.164 g sample gives 2.50×10⁻³ mol gases. What is M?',o:['Mg','Ca','Sr','Ba'],a:1,k:'Two moles nitrate produce five moles gas.',w:'Moles M(NO₃)₂=2/5×2.50×10⁻³=1.00×10⁻³ mol. Its molar mass is 164, so Ar(M)=164−124=40: calcium.',eq:'Mᵣ[M(NO₃)₂]=0.164/0.00100=164; Ar(M)=40',d:'Mg, Sr and Ba have incompatible relative atomic masses.',tip:'Use the total gas coefficient, not only NO₂.'},
{r:'DSE/19/1A/6',p:69,t:'2.53 g NaHCO₃ is heated and 1.59 g solid remains. Which equation matches?',o:['NaHCO₃ → NaOH + CO₂','2NaHCO₃ → Na₂O + 2CO₂ + H₂','2NaHCO₃ → Na₂CO₃ + H₂O + CO₂','2NaHCO₃ → Na₂O + H₂O + 2CO₂'],a:2,k:'Compare predicted solid mass with the measured residue.',w:'2.53 g NaHCO₃ is 0.0301 mol. It forms 0.0151 mol Na₂CO₃, mass≈1.60 g, matching 1.59 g.',eq:'2NaHCO₃(s) → Na₂CO₃(s) + H₂O(g) + CO₂(g)',d:'Other equations predict different residues and masses.',tip:'The solid residue is sodium carbonate.'},
{r:'DSE/25/1A/5',p:56,t:'Silver is extracted from Ag₂S at 85% yield. What Ag₂S mass is needed for 15.0 g Ag?',o:['14.6 g','17.2 g','20.3 g','34.5 g'],a:2,k:'Correct the required product amount for percentage yield.',w:'15.0 g Ag is 0.139 mol actual. Theoretical Ag needed=0.139/0.85 mol; Ag₂S moles are half this, giving 20.3 g.',eq:'m(Ag₂S)=(15.0/107.9)/0.85/2 × 247.9 = 20.3 g',d:'The other values omit yield or the 2:1 Ag:Ag₂S ratio.',tip:'Divide actual yield by fractional yield to get theoretical amount.'},
{r:'DSE/12/1A/23',p:49,t:'Iron and copper are separately immersed in hexane: iron corrodes faster. Iron oxidises more readily than copper. Choose the best answer.',o:['Both true; second explains first','Both true; second does not explain first','First false; second true','Both false'],a:2,k:'Corrosion needs suitable environmental conditions as well as reactivity.',w:'Neither metal corrodes in hexane because water/oxygen conditions are absent. However, iron is more readily oxidised than copper.',d:'The first statement is false and the second is true.',tip:'Do not infer actual corrosion from reactivity alone.'},
{r:'DSE/15/1A/5',p:70,t:'An iron nail corrodes in yellow gel containing NaCl, K₃Fe(CN)₆ and phenolphthalein. Which colour is NOT observed?',o:['blue','pink','grey','yellow'],a:2,k:'Corrosion indicators show Fe²⁺ and OH⁻ regions.',w:'Fe²⁺ with ferricyanide gives blue; OH⁻ turns phenolphthalein pink; unchanged gel remains yellow. Grey is not produced.',d:'Blue, pink and yellow all have chemical or background origins.',tip:'Link each indicator to its ion before choosing a colour.'},
{r:'DSE/18/1A/7',p:68,t:'Which statement concerning iron and magnesium is correct?',o:['Iron is ductile but magnesium is not.','Iron corrodes less readily than magnesium.','Magnesium is more abundant than iron in the crust.','Both have more than one oxidation number in their oxides.'],a:1,k:'Magnesium is more reactive and oxidises more readily than iron.',w:'Therefore magnesium corrodes more readily. Both are ductile metals; iron is more abundant in the stated comparison; Mg normally has only +2.',d:'A, C and D are false for the reasons stated.',tip:'Reactivity generally predicts ease of oxidation.'},
{r:'DSE/14/1A/3',p:19,t:'Iron nails are immersed in X: AgNO₃(aq), Y: Zn(NO₃)₂(aq), and Z: water. What is the ascending corrosion-rate order?',e:table(['Set-up','Liquid'],[['X','1 M AgNO₃(aq)'],['Y','1 M Zn(NO₃)₂(aq)'],['Z','H₂O(l)']]),o:['Z < Y < X','Y < Z < X','Z < X < Y','X < Z < Y'],a:0,k:'Electrolytes accelerate corrosion; Ag⁺ also promotes iron oxidation by displacement.',w:'Pure water Z gives the slowest corrosion. Ionic Y is faster. In X, Fe reduces Ag⁺ and is oxidised rapidly, so X is fastest.',eq:'Fe(s) + 2Ag⁺(aq) → Fe²⁺(aq) + 2Ag(s)',d:'Only Z < Y < X fits both electrolyte and displacement effects.',tip:'Check for both conductivity and a possible displacement reaction.'},
{r:'DSE/15/1A/7',p:87,t:'Which hook corrodes first?',e:vis(img.q41,'Four metal hook and board combinations'),o:['iron hook (1)','iron hook (2)','copper hook (3)','copper hook (4)'],a:1,k:'Iron corrodes faster when electrically connected to a less reactive metal such as copper.',w:'In set-up (2), iron is the more reactive metal of the Fe-Cu pair and becomes the anode.',d:'Aluminium sacrificially protects iron or copper; copper itself is not the sacrificial metal in the remaining pairs.',tip:'In contact corrosion, the more reactive metal corrodes.'},
{r:'DSE/20/1A/8',p:93,t:'Which X and Y make the iron nail rust fastest?',e:table(['Option','Gas X','Liquid Y'],[['A','hydrogen','petrol'],['B','hydrogen','distilled water'],['C','oxygen','petrol'],['D','oxygen','distilled water']]),o:['hydrogen + petrol','hydrogen + distilled water','oxygen + petrol','oxygen + distilled water'],a:3,k:'Rusting requires both oxygen and water.',w:'Only option D supplies oxygen gas and liquid water simultaneously.',d:'Hydrogen cannot replace oxygen; petrol excludes contact with water.',tip:'For basic rusting questions, look for the oxygen-and-water pair.'},
{r:'DSE/17/1A/13',p:55,t:'In which case would the iron nail corrode fastest?',e:vis(img.q43,'Four corrosion set-ups with ethanol, sodium nitrate, copper and a cell'),o:['95% ethanol','1 M NaNO₃','Connected to copper in 1 M NaNO₃','Cell-driven iron-copper set-up in 1 M NaNO₃'],a:3,k:'An electrolyte and an imposed electrical connection can drive iron oxidation fastest.',w:'In D, the cell connection withdraws electrons from iron, making it the oxidation site. NaNO₃ provides a conducting electrolyte.',d:'A lacks suitable water/oxygen; B is ordinary corrosion; C galvanic contact is faster than B but not the driven case D.',tip:'A power supply can override ordinary galvanic tendencies.'},
{r:'DSE/16/1A/5',p:86,t:'Why does tin plating prevent iron cans from rusting?',o:['Tin gives sacrificial protection.','The tin layer excludes air.','Tin is above iron in the reactivity series.','Tin and iron form a non-corroding alloy.'],a:1,k:'An intact coating prevents iron contacting oxygen and water.',w:'Tin is less reactive than iron, so it is not sacrificial. Its protection is a physical barrier.',d:'A and C reverse the reactivity relation; D is not how plating works.',tip:'Distinguish barrier protection from sacrificial protection.'},
{r:'DSE/13/1A/7',p:66,t:'Which methods can prevent rusting of a steel bicycle frame and gear system?',e:table(['Option','Frame','Gear system'],[['A','painting','greasing'],['B','painting','galvanising'],['C','tin-plating','greasing'],['D','tin-plating','galvanising']]),o:['painting + greasing','painting + galvanising','tin-plating + greasing','tin-plating + galvanising'],a:0,k:'Choose a practical barrier suited to each moving or exposed part.',w:'Paint protects the frame; grease protects moving gears while allowing motion. The other treatments are less suitable for the gear system or frame use.',d:'Galvanising gears is impractical; tin plating is not the preferred frame protection.',tip:'Questions may test suitability, not merely chemical possibility.'},
{r:'DSE/23/1A/21',p:86,t:'Which set-ups prevent an underground iron pipe from rusting?',e:vis(img.q46,'Impressed-current, silver-contact and magnesium-sacrificial pipe protection'),o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:1,k:'Iron is protected by cathodic current or a more reactive sacrificial metal.',w:'Set-up (1) supplies electrons by impressed current; set-up (3) uses Mg sacrificial protection. Silver in (2) is less reactive and accelerates iron corrosion.',d:'Any choice including set-up (2) is incorrect.',tip:'The attached sacrificial metal must be more reactive than iron.'},
{r:'DSE/25/1A/15',p:80,t:'Which method CANNOT prevent corrosion of an iron object?',o:['Immerse it in vinegar','Immerse it in oil','Connect it to zinc','Connect it to the negative pole of a cell'],a:0,k:'Acidic electrolyte accelerates iron corrosion.',w:'Vinegar is acidic and promotes iron dissolution. Oil is a barrier; zinc is sacrificial; the negative pole supplies electrons for cathodic protection.',d:'B, C and D are valid protective methods.',tip:'A conducting acidic solution is not a protective coating.'},
{r:'DSE/19/1A/15',p:24,t:'Which methods slow corrosion of an iron object?',e:st(['Connect it to lead.','Completely copper-plate it.','Connect it to the cathode of a chemical cell.']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:1,k:'A complete coating blocks air and water.',w:'Complete copper plating protects as a barrier. Lead is less reactive and makes iron the anode if connected; the stated chemical-cell cathode connection does not provide the required protective electron supply in this setup.',d:'Only statement (2) is accepted.',tip:'For plating with a less reactive metal, the coating must remain complete.'},
{r:'DSE/13/1A/6',p:51,t:'Which set-up best anodises an aluminium object?',e:vis(img.q49,'Four electrolysis set-ups for anodising aluminium'),o:['Set-up A','Set-up B','Set-up C','Set-up D'],a:1,k:'The aluminium object must be the positive electrode in dilute sulphuric acid.',w:'At the anode, aluminium surface oxidation forms and thickens Al₂O₃. Set-up B has the correct polarity and electrolyte.',d:'A has wrong polarity; C and D use concentrated NaCl, not the suitable anodising electrolyte.',tip:'Anodising means making the object the anode.'},
{r:'DSE/21/1A/18',p:66,t:'Why does aluminium oxide protect aluminium while iron oxide does not protect iron?',e:st(['Aluminium oxide adheres firmly; iron oxide adheres loosely.','Aluminium oxide is insoluble; iron oxide is soluble.','Aluminium oxide is giant ionic; iron oxide is not.']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:0,k:'A compact, adherent oxide layer blocks further attack.',w:'Statement (1) is correct. Both oxides are insoluble and both have giant ionic structures, so (2) and (3) are false.',d:'Only the physical adherence difference explains protection.',tip:'Protective oxide layers must be continuous and firmly attached.'},
{r:'DSE/16/1A/23',p:77,t:'During anodisation, aluminium oxide is reduced to metal. Anodisation enhances corrosion resistance. Choose the best answer.',o:['Both true; second explains first','Both true; second does not explain first','First false; second true','Both false'],a:2,k:'Anodisation oxidises aluminium and thickens its oxide layer.',w:'The first statement is false: oxide is formed/thickened, not reduced. The thicker adherent layer improves corrosion resistance, so the second is true.',d:'Therefore C is the only valid truth combination.',tip:'The anode is the site of oxidation.'},
{r:'DSE/26/1A/2',p:null,t:'How many oxygen atoms are present in 9.98 g quartz, SiO₂?',o:['0.83 × 10²³','1.00 × 10²³','1.33 × 10²³','2.00 × 10²³'],a:3,k:'Each SiO₂ formula unit contains two oxygen atoms.',w:'M(SiO₂)=60.1. Moles SiO₂=9.98/60.1=0.166; moles O atoms=0.332, giving 2.00×10²³ atoms.',eq:'2(9.98/60.1)(6.02×10²³)=2.00×10²³',d:'Smaller choices omit the factor of two or use a wrong molar mass.',tip:'Convert formula units to atoms using the subscript.'},
{r:'DSE/26/1A/3',p:null,t:'M forms MO, reacts with dilute HCl to give H₂, and shows no immediate change with cold water. What may M be?',o:['Al','Ca','Cu','Zn'],a:3,k:'Match oxide formula and reactivity observations.',w:'Zinc forms ZnO, reacts with dilute HCl, and has no immediate observable reaction with cold water.',d:'Al normally forms Al₂O₃; Ca reacts with cold water; Cu does not liberate H₂ from HCl.',tip:'All three observations must fit the same metal.'},
{r:'DSE/26/1A/4',p:null,t:'35.6 g hydrated Na₂CO₃ contains 25.8% sodium. What mass is lost on complete heating?',o:['2.4 g','14.4 g','21.2 g','24.4 g'],a:1,k:'Use sodium percentage to determine the water fraction.',w:'46/(106+18n)=0.258 gives n≈4. The anhydrous mass is 35.6×106/178=21.2 g, so water lost=14.4 g.',eq:'35.6 − 21.2 = 14.4 g',d:'Other choices confuse anhydrous mass, water percentage or formula mass.',tip:'Sodium remains in the residue; water is the lost mass.'},
{r:'DSE/26/1A/7',p:null,t:'Y and Z are same-group metals (atomic numbers ≤20): YSO₄ + Z(NO₃)₂ → ZSO₄(s) + Y(NO₃)₂. Which statement is correct?',o:['Both Y and Z do not react with cold water.','Atomic number of Y is smaller than Z.','SO₄²⁻ and NO₃⁻ are both spectator ions.','The reaction is redox.'],a:1,k:'The precipitation identifies Y=Mg and Z=Ca.',w:'CaSO₄ is sparingly soluble and precipitates; Mg has atomic number 12 and Ca 20. No oxidation numbers change.',d:'Ca reacts with cold water; sulphate forms the precipitate; the reaction is not redox.',tip:'Do not call an ion a spectator if it appears in the precipitate.'},
{r:'DSE/26/1A/15',p:null,t:'Which statements about silver are correct?',e:st(['Silver displaces copper from Cu(NO₃)₂.','Silver is obtained by strongly heating silver oxide.','Silver reacts readily with concentrated HCl to give AgCl and H₂.']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:1,k:'Silver is unreactive, but silver oxide is thermally unstable.',w:'Ag₂O decomposes on strong heating. Silver is below copper and hydrogen, so statements (1) and (3) are false.',d:'Only statement (2) is correct.',tip:'Low metal reactivity corresponds to easier oxide decomposition.'},
{r:'DSE/26/1A/21',p:null,t:'Potassium reacts completely with water containing phenolphthalein. Which observations are expected?',e:st(['Potassium burns with a lilac flame.','The solution turns pink.','A precipitate forms after a short time.']),o:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],a:0,k:'Potassium forms soluble KOH and hydrogen in a vigorous reaction.',w:'Heat may produce a lilac flame, and KOH turns phenolphthalein pink. Potassium compounds remain soluble, so no precipitate forms.',d:'Statement (3) is false; (1) and (2) are true.',tip:'Group I hydroxides are soluble.'},
{r:'DSE/26/1A/30',p:null,t:'For equal 100 cm³ samples of Cl₂ and CO₂ at the same conditions, which statements are correct?',e:st(['The mass of chlorine is smaller.','The numbers of molecules are equal.','The number of atoms in chlorine is smaller.']),o:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],a:3,k:'Equal gas volumes at the same conditions contain equal molecule numbers.',w:'Cl₂ and CO₂ have equal molecule counts. Cl₂ has greater molar mass, so its mass is greater. Each Cl₂ molecule has 2 atoms versus 3 in CO₂, so chlorine has fewer atoms.',d:'Statements (2) and (3) only are correct.',tip:'Avogadro law compares molecules; count atoms per molecule separately.'}
];
const key='metals-progress-v1';let current=0,state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;const el=id=>document.getElementById(id),saved=i=>state[i]||null;
function summary(){const done=Object.values(state).filter(v=>v&&v.checked),correct=done.filter(v=>v.selected===qs[v.index].a).length,pct=Math.round(done.length/qs.length*100);el('score').textContent=correct+'/'+done.length;el('progressText').textContent=pct+'% complete';el('progressBar').style.width=pct+'%'}
function nav(){el('questionNav').innerHTML=qs.map((q,i)=>{const s=saved(i);let c=i===current?'active ':'';if(s&&s.checked)c+=s.selected===q.a?'correct':'wrong';return '<button class="'+c.trim()+'" data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>'}).join('');el('questionNav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function render(){const q=qs[current],s=saved(current);selected=s?s.selected:null;el('pageTitle').textContent='Question '+(current+1);el('questionCount').textContent=(current+1)+' of '+qs.length;el('sourceTag').textContent=q.r;el('difficultyTag').textContent=q.p===null?'New · 2026':(q.p>=75?'Easy · ':q.p>=55?'Medium · ':'Hard · ')+q.p+'% correct';el('questionTitle').innerHTML=q.t;el('questionExtra').innerHTML=q.e||'';el('options').innerHTML=q.o.map((o,i)=>{let c='option';if(s&&s.checked)c+=i===q.a?' correct':i===s.selected?' wrong':'';else if(selected===i)c+=' chosen';return '<button class="'+c+'" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+o+'</span></button>'}).join('');el('options').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));el('checkButton').disabled=selected===null||!!(s&&s.checked);el('checkButton').textContent=s&&s.checked?'Answer checked':'Check answer';el('clearButton').disabled=selected===null||!!(s&&s.checked);el('previousButton').disabled=current===0;el('nextButton').disabled=current===qs.length-1;marking();nav();summary();window.scrollTo({top:0,behavior:'smooth'})}
function choose(i){selected=i;state[current]={index:current,selected:i,checked:false};localStorage.setItem(key,JSON.stringify(state));render()}function check(){if(selected===null)return;state[current]={index:current,selected,checked:true};localStorage.setItem(key,JSON.stringify(state));render()}function go(i){current=Math.max(0,Math.min(qs.length-1,i));render()}
function marking(){const q=qs[current],s=saved(current);if(!s||!s.checked){el('markingPanel').innerHTML='<div class="locked"><span>✓</span><h3>Detailed marking</h3><p>Select an option and check your answer to reveal the key principle, reasoning and distractor analysis.</p></div>';return}const ok=s.selected===q.a;el('markingPanel').innerHTML='<div class="explanation"><div class="answer-status '+(ok?'yes':'no')+'">'+(ok?'Correct · 1/1 mark':'Not correct · 0/1 mark')+'</div><p class="answer-label">CORRECT ANSWER · '+String.fromCharCode(65+q.a)+'</p><h3 class="result-title">'+q.k+'</h3><h4>REASONING</h4><p>'+q.w+'</p>'+(q.eq?'<div class="equation">'+q.eq+'</div>':'')+'<h4>DISTRACTOR ANALYSIS</h4><p>'+q.d+'</p><div class="tip"><b>EXAM TIP</b><p>'+q.tip+'</p></div></div>'}
el('checkButton').onclick=check;el('clearButton').onclick=()=>{delete state[current];localStorage.setItem(key,JSON.stringify(state));render()};el('previousButton').onclick=()=>go(current-1);el('nextButton').onclick=()=>go(current+1);el('resetButton').onclick=()=>{if(confirm('Reset all saved answers for Topic 03?')){state={};localStorage.removeItem(key);current=0;render()}};render();
</script></body></html>
