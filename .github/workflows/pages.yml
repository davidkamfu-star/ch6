name: Deploy revision hub and mathematics question bank

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore cached mathematics question bank
        uses: actions/cache@v4
        with:
          path: math-bank
          key: dse-bank-${{ hashFiles('.github/dse-bank-manifest.json') }}
      - name: Keep checked-in question bank code after cache restore
        run: git restore --source=HEAD --worktree -- math-bank
      - name: Restore and verify every question bank asset
        run: python3 .github/scripts/prepare_math_bank.py
      - name: Test PDF exports and partial asset cache recovery
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test math-bank/tests/pdf-export.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
