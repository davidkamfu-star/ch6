name: Chemistry World student journeys
on: [push, workflow_dispatch]
jobs:
  journeys:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: npm install --prefix /tmp/world-test playwright@1.55.0
      - run: |
          python3 -m http.server 8768 --bind 127.0.0.1 &
          NODE_PATH=/tmp/world-test/node_modules node tests/world.cjs
