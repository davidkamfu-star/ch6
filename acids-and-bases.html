const qs=[{"r":"DSE/25/1A/18","p":82,"t":"Which of the following set-ups can be used to collect H₂(g)? (1) (2) (3)","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. (2) and (3) only (1) H₂ (g) (relative molecular mass = 2.0) has a lower density than air (relative molecular mass ≈ 28.8). It cannot be collected using downward delivery / upward displacement of air. (2) H₂ (g) is insoluble in water. It can be collected using displacement of water.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option.","img":"q01","alt":"Hydrogen gas collection set-ups"},{"r":"DSE/15/1A/4","p":74,"t":"Which of the following salts CANNOT be prepared from the reaction of a metal with a dilute acid?","o":["zinc sulphate","iron(II) chloride","calcium chloride","copper(II) sulphate"],"a":3,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"D. copper(II) sulphate Copper does not react with dilute sulphuric acid.","d":"The other routes conflict with solubility, metal reactivity, safety, or the required method for a soluble or insoluble salt.","tip":"Decide whether the product is soluble before choosing direct reaction, titration or precipitation."},{"r":"DSE/13/1A/19","p":65,"t":"Which of the following statements about limestone is/are correct? (1) It gives a golden yellow flame in a flame test. (2) It gives a colourless gas when heated strongly. (3) It dissolves in dilute sulphuric acid to give a clear solution.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"B. (2) only (1) It gives a brick-red flame in a flame test. (3) The product CaSO₄ is insoluble in water. White precipitate is formed.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/20/1A/11","p":80,"t":"A reaction occurs when water is dropped into the mixture in the set-up below. A colourless gas is given out. What is the role of water in this reaction?","o":["Water reacts with sodium carbonate to give the colourless gas.","Water reacts with citric acid to give the colourless gas.","Water is a medium for the formation of carbonate ions from sodium carbonate.","Water is a medium for the formation of hydrogen ions from citric acid."],"a":3,"k":"Relate acid ionisation to the observed gas or collection method.","w":"Water dissolves citric acid so that it ionises to form H⁺(aq). The hydrogen ions then react with carbonate ions from sodium carbonate, releasing carbon dioxide.","d":"The remaining choices use the wrong reaction condition, observation, species, apparatus rule or chemical property.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option.","img":"q04","alt":"Water added to a citric acid and sodium carbonate mixture"},{"r":"DSE/16/1A/7","p":58,"t":"Consider the following experimental set-up: A colourless gas is given out when water is dropped to the mixture. Which of the following statement is correct?","o":["Oxalic acid ionizes in water to give hydrogen ions.","Zinc ionizes in water to give zinc ions.","Water reacts with oxalic acid to give the colourless gas.","Water reacts with zinc to give the colourless gas."],"a":0,"k":"Relate acid ionisation to the observed gas or collection method.","w":"A. Oxalic acid ionizes in water to give hydrogen ions. Oxalic acid dissolves in water to give hydrogen ions, which react with zinc powder to give hydrogen gas.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option.","img":"q05","alt":"Water added to zinc and oxalic acid powder"},{"r":"DSE/14/1A/24","p":51,"t":"Consider the following statements and choose the best answer: 1st statement 2nd statement All acidic gases can react with CaO(s) to form salt and water only. All acidic gases contain hydrogen as one of their constituent atoms.","o":["Both statements are true and the 2nd statement is a correct explanation of the 1st statement.","Both statements are true and the 2nd statement is NOT a correct explanation of the 1st statement.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":3,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"D. Both statements are false. (1) There is no water formed when acidic gases react with CaO(s). For example, CaO(s) + CO₂ (g) → CaCO₃ (s) (2) Acidic gases do not necessarily contain H atom, e.g. CO₂ , NO₂ , SO₂ .","d":"The other routes conflict with solubility, metal reactivity, safety, or the required method for a soluble or insoluble salt.","tip":"Decide whether the product is soluble before choosing direct reaction, titration or precipitation."},{"r":"DSE/21/1A/24","p":64,"t":"Consider the following statements and choose the best answer: 1st statement 2nd statement Iron(II) hydroxide is a base. Iron(II) hydroxide is insoluble in water.","o":["Both statements are true and the 2nd statement is a correct explanation of the 1st statement.","Both statements are true and the 2nd statement is NOT a correct explanation of the 1st statement.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":1,"k":"Use the defining reactions and properties of bases and alkalis.","w":"B. Both statements are true and the 2nd statement is NOT a correct explanation of the 1st statement. Iron(II) hydroxide is a base because it neutralizes acid to give salt and water only.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/18/1A/6","p":65,"t":"Dilute sodium hydroxide solution is added to a 0.1 M solution until in excess. Which of the following combinations is correct? Solution Observation","o":["zinc sulphate white precipitate formed","calcium nitrate white precipitate formed","lead(II) nitrate yellow precipitate formed","iron(III) sulphate dirty green precipitate formed"],"a":1,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"B. calcium nitrate white precipitate formed A Zinc hydroxide is soluble in excess NaOH(aq). C The precipitate formed (lead(II) hydroxide) is white in colour. The precipitate is soluble in excess NaOH(aq). D The precipitate formed (iron(III) hydroxide) is yellow-brown in colour.","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/13/1A/9","p":64,"t":"Which of the following statements about potassium hydroxide solution is INCORRECT?","o":["When potassium hydroxide solution is added to iron (III) sulphate solution, a dirty green precipitate is formed.","When potassium hydroxide solution is heated with ammonium chloride solution, ammonia gas is liberated.","Dilute potassium hydroxide solution contains K+ (aq) ions, H⁺ (aq) ions and OH– (aq) ions.","Concentrated potassium hydroxide solution is corrosive."],"a":0,"k":"Use the defining reactions and properties of bases and alkalis.","w":"A. When potassium hydroxide solution is added to iron (III) sulphate solution, a dirty green precipitate is formed. The precipitate should be brown in colour.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/19/1A/20","p":49,"t":"Aqueous calcium hydroxide can be used to (1) neutralize acidic substances in soil. (2) distinguish carbon dioxide from carbon monoxide. (3) remove sulphur dioxide from a polluted air sample.","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":3,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"D. (1), (2) and (3) (2) Only carbon dioxide turns Ca(OH)₂ milky. (3) Ca(OH)₂ reacts with SO₂ to give CaSO₃ and H₂O","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/17/1A/17","p":59,"t":"Which of the following statements concerning NaOH(aq) and NH₃(aq) is / are correct? (1) Both of them can react with MgCl₂(aq). (2) Both of them can form a deep blue solution with Cu(OH)₂(s). (3) NaOH(aq) can react with CH₃COOH(aq), but NH₃(aq) cannot.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":0,"k":"Test every statement against the relevant acid-base chemistry.","w":"A. (1) only (2) Cu(OH)₂ (s) does not dissolve in NaOH(aq) (3) Both NaOH(aq) and NH₃ (aq) are alkaline. They can react with CH₃COOH(aq).","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/14/1A/21","p":32,"t":"Which of the following processes would show a blue colour? (1) adding litmus to NaOH(aq) (2) mixing CuSO₄(s) and NH₃(aq) (3) mixing K₃Fe(CN)₆(aq) and FeCl2(aq)","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. (1), (2) and (3) (1) Litmus shows a blue colour in alkaline solution. (2) Cu²⁺ (aq) ions dissolve in excess NH₃ (aq) to give a deep blue solution. (3) K₃Fe(CN)₆ (aq) gives a blue product in the presence of Fe²⁺ (aq) ions.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/25/1A/19","p":36,"t":"When metal X is added to copper(II) nitrate solution, a blue solid is formed as one of the products. Which of the following metals may X be? (1) zinc (2) calcium (3) sodium","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. (2) and (3) only The blue solid is probably a result of an insoluble compound containing copper(II) ions. When Ca and Na are added to Cu(NO₃)₂ (aq), they react with water in the solution and form an alkaline solution. Cu²⁺ (aq) ions react with OH⁻ (aq) ions in the alkaline solution to give a blue precipitate of Cu(OH)₂ (s).","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/25/1A/20","p":76,"t":"Refer to the diagram below: Which of the following statements is / are correct? (1) A colourless gas with a characteristic pungent smell is given out. (2) The dry cobalt(II) chloride paper turns blue. (3) The moist pH paper turns blue.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. (1) and (3) only (1) When NH₄Cl is heated with NaOH, NH₃ (g) with a pungent smell is formed. (2) The dry cobalt(II) chloride paper turns from blue to pink as the NH₃ (g) formed contains moisture. (3) NH₃ (g) turns the moist pH paper blue.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option.","img":"q14","alt":"Ammonia preparation and indicator papers"},{"r":"DSE/12/1A/19","p":59,"t":"In which of the following processes would a colourless gas evolve? (1) Magnesium is added to dilute sulphuric acid. (2) Ammonium chloride is heated with calcium hydroxide. (3) Water is added to a solid mixture of citric acid and sodium hydrogencarbonate.","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":3,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"D. (1), (2) and (3) (1) Mg reacts with dilute H₂SO₄ (aq) to give hydrogen gas. (2) NH₄Cl reacts with Ca(OH)₂ to give ammonia gas. (3) Citric acid dissolves in water to give H⁺ (aq) which react with NaHCO₃ to give CO₂ gas.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/22/1A/18","p":19,"t":"Which of the following pairs of substances, when mixed, would release hydrogen gas? (1) copper and concentrated HCl(aq) (2) iron and H₂SO₄(aq) (3) calcium and NaOH(aq)","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":3,"k":"Relate acid ionisation to the observed gas or collection method.","w":"D. (2) and (3) only (1) Concentrated HCl(aq) behaves like dilute HCl(aq) (3) Calcium reacts with water in NaOH(aq) to give hydrogen gas.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/12/1A/20","p":71,"t":"Which of the following methods can be used to distinguish between ZnCl₂(aq) and CaBr₂(aq)? (1) adding NH₃(aq) (2) performing flame test (3) evaporating to dryness","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":0,"k":"Apply solubility rules and qualitative-analysis observations.","w":"A. (1) and (2) only (1) ZnCl₂ (aq) gives a white precipitate which dissolves in excess NH₃ (aq). CaBr₂ (aq) gives no precipitate in NH₃ (aq). (2) CaBr₂ (aq) gives a brick-red flame while there is no characteristic flame colour for ZnCl₂ (aq). (3) Both ZnCl₂ (s) and CaBr₂ (s) are white solids.","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/17/1A/21","p":68,"t":"Which of the following can distinguish a sample of AgNO₃(aq) from a sample of NaNO₃(aq)? (1) adding Cu(NO₃)₂(aq) to the samples (2) adding HCl(aq) to the samples (3) adding KOH(aq) to the samples","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":2,"k":"Apply solubility rules and qualitative-analysis observations.","w":"C. (2) and (3) only (2) AgNO₃ (aq) gives a white precipitate (AgCl) in HCl(aq) while there is no observable change in NaNO₃ (aq). (3) AgNO₃ (aq) gives a brown precipitate (Ag₂O) in KOH(aq) while there is no observable change in NaNO₃ (aq).","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/23/1A/7","p":70,"t":"Which of the following statements concerning aqueous ammonia is INCORRECT?","o":["Aqueous ammonia is a weak alkali.","Concentrated aqueous ammonia is corrosive.","Aqueous ammonia can be used to distinguish between Pb(NO₃)₂(aq) and Al(NO₃)₃(aq).","When aqueous ammonia is added to CuSO₄(aq) until in excess, a deep blue solution is formed."],"a":2,"k":"Use the defining reactions and properties of bases and alkalis.","w":"Aqueous ammonia cannot distinguish Pb²⁺(aq) from Al³⁺(aq): both form white hydroxide precipitates that are insoluble in excess aqueous ammonia. Therefore statement C is the incorrect statement.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/14/1A/15","p":70,"t":"Which of the following hazard warning labels should be displayed on both the reagent bottle storing concentrated sulphuric acid and the reagent bottle storing concentrated hydrochloric acid? (1) (2) (3)","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"B. (2) only Concentrated sulphuric acid is corrosive and oxidizing while concentrated hydrochloric acid is irritant and corrosive.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option.","img":"q20","alt":"Irritant, corrosive and oxidising hazard labels"},{"r":"DSE/20/1A/17","p":85,"t":"Which of the following ways is / are acceptable in the storage of the chemical concerned? (1) Store concentrated H₂SO₄(l) in a copper container. (2) Store concentrated AgNO₃(aq) in a brown glass container. (3) Store concentrated Pb(NO₃)₂(aq) in an iron container.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"Test every statement against the relevant acid-base chemistry.","w":"B. (2) only (1) Concentrated H₂SO₄ (l) reacts with unreactive metals. (2) AgNO₃ (aq) is put in a brown glass container to prevent decomposition to NO₂ (g) by sunlight. (3) Iron is more reactive than lead. Fe displaces Pb from Pb(NO₃)₂ (aq).","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/12/1A/10","p":88,"t":"A sample of 1.02 g of potassium hydrogenphthalate (C₈H₅O₄K) is dissolved completely in distilled water, and then diluted to 250.0 cm³ . What is the concentration of the solution obtained? (Relative atomic masses: H = 1.0, C = 12.0, O = 16.0, K = 39.1)","o":["0.004 M","0.010 M","0.020 M","4.080 M"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. 0.020 M Number of moles of C₈H₅O₄K = 1.02 12.0×8+1.0×5+16.0×4+39.1 = 4.998×10⁻³ mol Concentration of the solution = 4.998×10⁻³ ÷ 250.0 1000 = 0.020 M","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/15/1A/1","p":46,"t":"Which of the following statements is correct?","o":["All aqueous solutions contain H⁺ (aq) ions.","The pH of all acid solutions is greater than zero.","All acidic compounds contain hydrogen as their constituent elements.","A ‘corrosive’ hazard warning label must be displayed on all reagent bottles containing acid solution."],"a":0,"k":"Test every statement against the relevant acid-base chemistry.","w":"A. All aqueous solutions contain H⁺ (aq) ions. B Acid solutions with H⁺ concentration higher than 1 mol dm⁻³ have pH lower than zero. C CO₂ is an acidic gas. It does not contain H as its constituent element. D If the concentration of the acid solution is low, a ‘corrosive’ label is not necessary.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/16/1A/6","p":59,"t":"The pH of a sample of sulphuric acid is 2.6. 100 cm³ of this sample is mixed with 100 cm³ of water. What is the pH of the resulting mixture?","o":["5.8","2.9","2.6","1.3"],"a":1,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"B. 2.9 pH = –log[H⁺ (aq)] [H⁺ (aq)] = 10⁻².6 = 2.512×10⁻³ mol dm⁻³ After dilution, [H⁺ (aq)] = 2.512×10⁻³ × 100/200 = 1.256×10⁻³ mol dm⁻³ pH = –log[H⁺ (aq)] = –log(1.256×10⁻³ ) = 2.9","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/18/1A/11","p":50,"t":"Consider the solutions W, X, Y and Z below: W 100 cm³ of 0.20 M HNO₃(aq) X 50 cm³ of 0.20 M HCl(aq) Y 100 cm³ of 0.20 M CH3CO₂H(aq) Z 50 cm³ of 0.10 M NaOH(aq) Which of the following statements is correct?","o":["The pH of Y equals –log0.2.","Mixing W and Z gives a neutral solution.","The pH of the mixture of W and X is lower than that of W.","The pH of the mixture of W and X is lower than that of the mixture of X and Y."],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. The pH of the mixture of W and X is lower than that of the mixture of X and Y . A CH₃COOH is a weak acid. It only ionizes partially in water. [H⁺ (aq)] does not equal [CH₃COOH(aq)]. B HNO₃ + NaOH → NaNO₃ + H₂O Number of moles of H NO 3 = 0.20×50/1000 = 0.01 mol Number of moles of NaOH = 0.10×50/1000 = 0.005 mol HNO₃ is in excess. The resultant solution is acidic. C Both W and X contain a monobasic acid of same concentration. pH of mixture of W and X is the same as the pH of W and X.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/21/1A/6","p":77,"t":"Refer to the information in the table below: Solution Content pH X 50 cm³ of 0.001 M HCl(aq) 3.0 Y 25 cm³ of 0.001 M H₂SO₄(aq) 2.7 Z 50 cm³ of 0.1 M CH₃COOH(aq) 2.9 Which of the following statements is correct?","o":["X has a higher pH than Z because HCl is a stronger acid than CH₃COOH.","Y has a lower pH than X because the volume of H₂SO₄(aq) is smaller than that of HCl(aq).","Y has a lower pH than X because H₂SO₄ is a strong dibasic acid but HCl is a strong monobasic acid.","Y has a lower pH than Z because the concentration of H₂SO₄(aq) is lower than that of CH₃COOH(aq)."],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. Y has a lower pH than X because H₂SO₄ is a strong dibasic acid but HCl is a strong monobasic acid. An acid shows a lower pH when there is a higher concentration of H⁺ (aq) A X has a higher pH than Z because HCl has a much lower concentration than CH₃COOH D Difference in pH in Y and Z is a combined effect of concentration and strength of acid","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/14/1A/13","p":76,"t":"Which of the following gases, after dissolved in 1 dm³ of water, would give a solution with the highest pH?","o":["0.002 mol of NO₂","0.002 mol of SO₂","0.002 mol of NH₃","0.002 mol of HCl"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. 0.002 mol of NH₃ NH₃ is an alkaline gas","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/16/1A/18","p":85,"t":"Which of the following statements concerning vinegar is / are correct? (1) The process of forming hydrogen ions in vinegar is reversible. (2) Neutralisation occurs when sugar is added to vinegar. (3) The pH of vinegar used in kitchen is around 1.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":0,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"A. (1) only (2) Sugar is not a base. (3) Vinegar is not that acidic.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/17/1A/2","p":64,"t":"Which of the following statements concerning hydrochloric acid is INCORRECT?","o":["It is a mineral acid.","It completely ionizes in water.","It contains aqueous hydrogen ions.","It does not contain aqueous hydroxide ions."],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. It does not contain aqueous hydroxide ions. Water in hydrochloric acid ionizes into H⁺ and OH⁻ ions.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/12/1A/4","p":71,"t":"Which of the following statements concerning CH₃COOH and HCl is correct?","o":["CH₃COOH is a stronger acid than HCl.","The pH of 0.1 M CH₃COOH(aq) is lower than that of 0.1 M HCl(aq).","Both CH₃COOH(aq) and HCl(aq) react with NH₃(aq), each giving a salt.","Both CH₃COOH(aq) and HCl(aq) react with Ag(s), each giving a colourless gas."],"a":2,"k":"Test every statement against the relevant acid-base chemistry.","w":"C. Both CH₃COOH(aq) and HCl(aq) react with NH₃ (aq), each giving a salt. A CH₃COOH is a weak acid while HCl is a strong acid. B CH₃COOH only slightly dissociates in water to give H⁺ while HCl completely dissociates in water. The pH of same concentration of HCl is lower than that of CH₃COOH. D Ag is an unreactive metal. It does not react with dilute acids.","d":"Each alternative combination contains at least one statement contradicted by the marking notes above.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/25/1A/12","p":67,"t":"Refer to the following two solutions: X: 25.0 cm³ of 0.5 M HCl(aq) Y: 25.0 cm³ of 0.5 M CH₃COOH(aq) Which of the following statements is correct?","o":["X has a higher pH than Y.","Both X and Y have the same electrical conductivity.","The reaction of X with excess Mg(s) releases the same amount of heat as the reaction of Y with excess Mg(s).","Complete neutralisation of X and complete neutralisation of Y require the same volume of 0.5M NaOH(aq)."],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. Complete neutralisation of X and complete neutralisation of Y require the same volume of 0.5M NaOH(aq). A CH₃COOH is a weak acid while HCl is a strong acid. Under the same concentration of acid, HCl has a lower pH as HCl ionizes completely in water to give more H⁺ ions than CH₃COOH. B A higher concentration of mobile ions in HCl(aq) results in a higher electrical conductivity. C Some of the heat given out in the reaction is used to ionize more CH₃COOH molecules to give H⁺ (aq) ions. Thus, less heat will be given out for the reaction of Y with excess Mg(s). D As both solutions contain the same volume and concentration, they have the same amount of acid molecules. One mole of the acid molecule reacts with one mole of NaOH and they require the same amount of NaOH to be neutralized.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/22/1A/22","p":54,"t":"Both A and B are monobasic acids. The pH of 0.10 M A(aq) is 1.0 and the pH of 0.10 M B(aq) is 3.0. Which of the following statements are correct? (1) A is a stronger acid than B. (2) Some B molecules are present in B(aq). (3) Complete neutralization of 25.0 cm³ of 0.10 M A(aq) and complete neutralization of 25.0 cm³ 0.10 M B(aq) require the same number of moles of NaOH(aq).","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":3,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"D. (1), (2) and (3) (1) Under the same concentration and basicity, the pH of A (aq) is lower than B (aq). (3) As both solutions contain the same volume and concentration, they have the same amount of acid molecules.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/14/1A/6","p":64,"t":"50.0 cm³ of 0.6 M FeSO₄(aq) is mixed with 150.0 cm³ of 0.2 M Fe2(SO4)3(aq). What is the concentration of SO4 2– (aq) ions in the resulting mixture?","o":["0.3 M","0.4 M","0.6 M","0.8 M"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. 0.6 M Total number of moles of SO₄²⁻ (aq) = 0.6×50/1000 + 0.2×(150/1000)×3 = 0.12 mol Concentration of SO₄²⁻ (aq) ions = 0.12 ÷ (200/1000) = 0.6 M","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/13/1A/10","p":75,"t":"Consider the four solutions W, X, Y and Z listed below: W: 0.01 mol dm⁻³ HNO₃(aq) X: 0.01 mol dm⁻³ H₂SO₄(aq) Y: 0.01 mol dm⁻³ KOH(aq) Z: 0.10 mol dm⁻³ KOH(aq) Which of the following represents the four solutions arranged in increasing order of pH?","o":["W, X, Y, Z","W, X, Z, Y","X, W, Y, Z","X, W, Z, Y"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. X , W , Y , Z H₂SO₄ (aq) is a dibasic acid while HNO₃ (aq) is a monobasic acid. With the same concentration,H₂SO₄ (aq) gives more H⁺ (aq) in water. Thus H₂SO₄ (aq) has the lowest pH. KOH(aq) with a higher concentration gives more OH⁻ (aq) in water. 0.1 M has the highest pH.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/24/1A/4","p":52,"t":"Y is a monobasic acid. The pH of 0.1 M Y(aq) is 2.91. Which of the following statements concerning the 0.1 M Y(aq) is correct?","o":["It is a concentrated solution of a weak acid.","It is a concentrated solution of a strong acid.","It is a dilute solution of a weak acid.","It is a dilute solution of a strong acid."],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. It is a dilute solution of a weak acid. For [H⁺ ] = 0.1 M, pH = –log[H⁺ ] = –log(0.1) = 1 < 2.91 Thus Y only ionizes slightly in water to give H⁺ ions. It is a weak acid.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/18/1A/24","p":48,"t":"Consider the following statements and choose the best answer: 1st statement 2nd statement To completely neutralize 1 mole of HCl(aq), the number of moles of NH₃(aq) needed is more than the number of moles of KOH(aq) needed. NH₃(aq) is a weaker alkali than KOH(aq).","o":["Both statements are true and the 2nd statement is a correct explanation of the 1st statement.","Both statements are true and the 2nd statement is NOT a correct explanation of the 1st statement.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":2,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"C. The 1st statement is false but the 2nd statement is true. (1) 1 mole of HCl(aq) requires both NH₃ (aq) and KOH(aq) for 1 mole. NH₃ (aq) + HCl(aq) → NH₄Cl(aq) KOH(aq) + HCl(aq) → KCl(aq) + H₂O(l)","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/13/1A/11","p":62,"t":"Which of the following pairs of aqueous solutions, when mixed, would give a precipitate?","o":["lead(II) nitrate and ammonia","copper(II) sulphate and sodium nitrate","calcium chloride and sodium nitrate","iron(II) sulphate and acidified potassium dichromate"],"a":0,"k":"Apply solubility rules and qualitative-analysis observations.","w":"A. lead(II) nitrate and ammonia lead(II) hydroxide is formed","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/12/1A/2","p":54,"t":"A small amount of powder can dissolve in water to form a clear solution. When this solution is mixed with K2CO3(aq), a white precipitate is obtained. What can the powder be?","o":["sodium sulphate","calcium sulphate","sodium hydroxide","calcium hydroxide"],"a":3,"k":"Apply solubility rules and qualitative-analysis observations.","w":"D. calcium hydroxide Calcium sulphate is insoluble in water. It cannot dissolve in water. All compounds containing sodium ion are soluble in water. They do not form precipitate when mixing with K 2 CO 3 (aq). Calcium carbonate is insoluble in water. When calcium hydroxide is mixed with K 2 CO 3 , CaCO₃ is formed.","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/23/1A/3","p":73,"t":"Solid W dissolves in water to form an alkaline solution. What is W?","o":["calcium oxide","calcium chloride","copper(II) oxide","copper(II) chloride"],"a":0,"k":"Use the defining reactions and properties of bases and alkalis.","w":"A. calcium oxide Copper(II) oxide is insoluble in water. Calcium chloride and copper(II) chloride are soluble in water but the solution formed is neutral. Calcium oxide is slightly soluble in water and calcium hydroxide solution is formed.","d":"The remaining choices use the wrong reaction condition, observation, species, apparatus rule or chemical property.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/16/1A/8","p":66,"t":"Which of the following pairs of substances, when mixed together, can be used to prepare copper(II) sulphate crystals?","o":["CuO(s) and H₂SO₄(aq)","CuO(s) and MgSO₄(aq)","Cu(s) and H₂SO₄(aq)","Cu(s) and MgSO₄(aq)"],"a":0,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"A. CuO(s) and H₂SO₄ (aq) Cu(s) does not react with dilute H₂SO₄ (aq) or MgSO₄ (aq). CuO(s) does not react with MgSO₄ (aq).","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/17/1A/6","p":55,"t":"Which of the following is NOT the appropriate substance for preparing magnesium sulphate by directly mixing it with dilute sulphuric acid?","o":["magnesium metal","magnesium oxide","magnesium nitrate","magnesium carbonate"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"C. magnesium nitrate Magnesium sulphate is a soluble salt. It should be prepared by reacting a metal / metal oxide / metal carbonate with an acid.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/25/1A/6","p":63,"t":"Which of the following methods is NOT suitable for preparing zinc sulphate crystals in a school laboratory?","o":["adding excess zinc solid to copper(II) sulphate solution","adding excess zinc chloride solid to copper(II) sulphate solution","adding excess zinc oxide solid to dilute sulphuric acid","adding excess zinc carbonate solid to dilute sulphuric acid"],"a":1,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"Zinc sulphate is a soluble salt. It should be prepared by reacting a metal / metal oxide / metal carbonate with an acid. A Displacement reaction occurs. Zinc sulphate solution and copper solid will be formed.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/24/1A/5","p":57,"t":"Which of the following is the best process to prepare lead(II) sulphate?","o":["adding lead granules to dilute sulphuric acid","adding lead(II) carbonate powder to dilute sulphuric acid","adding lead(II) chloride solid to sodium sulphate solution","adding lead(II) nitrate solution to sodium sulphate solution"],"a":3,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"D. adding lead(II) nitrate solution to sodium sulphate solution Lead(II) sulphate is an insoluble salt, which should be prepared by precipitatation. Two solutions are mixed to prepare an insoluble salt.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/13/1A/8","p":41,"t":"Which of the following reaction routes can best be used to prepare barium sulphate from barium carbonate?","o":["BaCO3(s) H₂SO₄(aq) → BaSO₄(s)","BaCO3(s) conc. H₂SO₄(aq) → BaSO₄(s)","BaCO3(s) HCl(aq) → BaCl₂ H₂SO₄(aq) → BaSO₄(s)","BaCO3(s) conc. HCl(aq) → BaCl₂ Na₂SO₄(aq) → BaSO₄(s)"],"a":2,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"C. BaCO 3 (s) HCl(aq) → BaCl₂ H₂SO₄ (aq) → BaSO₄ (s) A & B are not workable as the reaction between BaCO 3 and H₂SO₄ gives an insoluble coat on BaCO 3 which stops further reaction. Only a small amount of BaCO 3 is produced. D is not preferred as concentrated HCl(aq) is used. Safety concerns arise.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/20/1A/18","p":59,"t":"Which of the following steps can be involved in preparing copper(II) chloride crystals? (1) Add CuCO3(s) to HCl(aq). (2) Add Cu(NO₃)₂(s) to NaCl(aq). (3) Add Cu(s) to HCl(aq).","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":0,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"A. (1) only Copper(II) chloride is a soluble salt. It can be prepared by reacting a metal / metal oxide / metal carbonate with an acid. (3) Cu(s) is unreactive. It does not react with HCl(aq).","d":"The other routes conflict with solubility, metal reactivity, safety, or the required method for a soluble or insoluble salt.","tip":"Decide whether the product is soluble before choosing direct reaction, titration or precipitation."},{"r":"DSE/22/1A/7","p":60,"t":"A white solid does NOT dissolve in both water and excess aqueous ammonia. Which of the following may this solid be?","o":["Pb(NO₃)₂","Zn(OH)2","MgSO₄","CaCO₃"],"a":3,"k":"Use the defining reactions and properties of bases and alkalis.","w":"D. CaCO₃ A&C Pb(NO₃)₂ and MgSO₄ are soluble in water. B Zn(OH) 2 dissolves in excess aqueous ammonia to give a colourless solution.","d":"The remaining choices use the wrong reaction condition, observation, species, apparatus rule or chemical property.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/13/1A/3","p":64,"t":"Solid Y is soluble in cold water. When an aqueous solution of Y is added separately to sodium hydroxide solution and to acidified silver nitrate solution, a white precipitate is formed in both cases. Which of the following compounds might Y be?","o":["ammonium carbonate","zinc carbonate","lead(II) chloride","magnesium chloride"],"a":3,"k":"Apply solubility rules and qualitative-analysis observations.","w":"D. magnesium chloride A ammonium carbonate is soluble in acidified silver nitrate solution B zinc carbonate is insoluble in water C lead(II) chloride is insoluble in cold water","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/21/1A/13","p":66,"t":"W, X, Y and Z, each represents one of the following solutions: HCl(aq) NaOH(aq)MgCl₂(aq)Na₂CO₃(aq) Given that: ‧ Mixing W and X gives a white precipitate. ‧ Mixing W and Y gives a white precipitate. ‧ Mixing W and Z gives a clear colourless solution. What is Z?","o":["HCl(aq)","NaOH(aq)","MgCl₂(aq)","Na₂CO₃(aq)"],"a":0,"k":"Apply solubility rules and qualitative-analysis observations.","w":"A. HCl(aq) The following shows possible reactions between solutions: HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l) HCl(aq) + Na₂CO₃ (aq) → 2NaCl(aq) + CO₂ (g) + H₂O(l) 2NaOH(aq) + MgCl₂ (aq) → Mg(OH)₂ (s) + 2NaCl(aq) Na₂CO₃ (aq) + MgCl₂ (aq) → MgCO₃ (s) + 2NaCl(aq) From the above, it can be deduced that W is MgCl₂ (aq) as MgCl₂ involves in two reactions giving precipitate. Thus Z cannot be NaOH(aq) or Na₂CO₃ (aq). It is HCl(aq).","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."},{"r":"DSE/23/1A/14","p":80,"t":"0.729 g of magnesium ribbon reacts with 50.0 cm³ of 0.50 M sulphuric acid. What is the mass of magnesium ribbon remained after the reaction has completed? (Relative atomic mass : Mg = 24.3)","o":["0.122 g","0.243 g","0.425 g","0.608 g"],"a":0,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"A. 0.122 g Mg(s) + H₂SO₄ (aq) → MgSO₄ (aq) + H₂ (g) Number of moles of H₂SO₄ = 0.50 × 50.0/1000 = 0.025 mol Number of moles of Mg added = 0.729 / 24.3 = 0.03 mol Number of moles of Mg left = 0.03 – 0.025 = 0.005 mol Mass of Mg remained = 0.005 × 24.3 = 0.1215 g","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/15/1A/9","p":87,"t":"In an experiment to prepare calcium sulphate, excess dilute sulphuric acid is added to 10.0 cm³ of 1.0 mol dm–3 calcium nitrate solution. Which of the following is the theoretical mass of the calcium sulphate obtained? (Relative atomic masses: O = 16.0, S = 32.1, Ca = 40.1)","o":["0.68 g","1.36 g","2.72 g","4.08 g"],"a":1,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"B. 1.36 g H₂SO₄ (aq) + Ca(NO 3 ) 2 (aq) → CaSO₄ (s) + 2HNO₃ (aq) 1.0 mol dm⁻³ 10.0 cm³ Number of moles of Ca(NO 3 ) 2 = 1.0×(10/1000) = 0.01 mol Number of moles of CaSO₄ = 0.01 mol Molar mass of CaSO₄ = 40.1 + 32.1 + 16.0×4 = 136.2 g mol –1 Mass of CaSO₄ = 0.01×136.2 = 1.362 g","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/22/1A/6","p":58,"t":"Copper(II) phosphate is insoluble in water. What is the number of moles of Cu²⁺ (aq) ions remaining in the solution of the resulting mixture when 0.04 mol of CuCl₂(aq) is mixed with 0.02 mol of Na₃PO₄(aq)?","o":["0.00","0.01","0.02","0.03"],"a":1,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"B. 0.01 3CuCl₂ (aq) + 2Na₃PO₄ (aq) →Cu₃(PO₄)₂ (s) + 6NaCl(aq) / 3Cu2 + (aq) + 2PO₄³⁻ (aq) → Cu₃(PO₄)₂ (s) Number of moles of phosphate ions = 0.02 mol From the equation, 3 moles of Cu²⁺ reacts with 2 moles of PO₄³⁻ . Number of moles of copper(II) ions consumed = 0.02 × 3 2 = 0.03 mol Number of moles of remaining copper(II) ions = 0.04 – 0.03 = 0.01 mol","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/17/1A/10","p":57,"t":"Calcium phosphate is insoluble in water. What is the theoretical number of moles of calcium phosphate obtained when 100.0 cm³ of 0.30 mol dm–3 CaCl₂(aq) is mixed with 300.0 cm³ of 0.10 mol dm–3 Na₃PO₄(aq)? (Relative atomic masses: O = 16.0, Na = 23.0, P = 31.0, Cl = 35.5, Ca = 40.1)","o":["0.010","0.015","0.020","0.030"],"a":0,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"A. 0.010 3CaCl₂ (aq) + 2Na₃PO₄ (aq) → Ca₃(PO₄)₂ (s) + 6NaCl(aq) 100.0 cm³ 300.0 cm³ 0.30 mol dm⁻³ 0.10 mol dm⁻³ Number of moles of CaCl₂ = 0.30×100/1000 = 0.03 mol Number of moles of Na₃PO₄ = 0.10×300/1000 = 0.03 mol CaCl₂ is the limiting reagent. Number of moles of Ca₃(PO₄)₂ formed = 0.03/3 = 0.010 mol","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/22/1A/10","p":60,"t":"6.54 g of zinc granules are added to 100.0 cm³ of 1.0 M AgNO₃(aq). After the reaction has completed, which of the following statements is correct? (Relative atomic masses: Zn = 65.4, Ag = 107.9)","o":["Some zinc granules have reacted and no silver ions remain in the solution.","All the zinc granules have reacted and no silver ions remain in the solution.","All the zinc granules have reacted and some silver ions remain in the solution.","The mass of the zinc granules reacted is equal to the mass of the solid product formed."],"a":0,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"A. Some zinc granules have reacted and no silver ions remain in the solution. Zn(s) + 2AgNO₃ (aq) → Zn(NO₃)₂ (aq) + 2Ag(s) Number of moles of Zn = 6.54 / 65.4 = 0.1 mol Number of moles of AgNO₃ = 1.0 × 100.0/1000 = 0.1 mol According to the equation, 1 mole of Zn reacts with 2 moles of AgNO₃ . Thus AgNO₃ is the limiting reagent.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/19/1A/5","p":59,"t":"25.00 cm³ of 0.50 M lead(II) nitrate solution is mixed with 50.00 cm³ of 1.00 M sodium chloride solution. Insoluble lead(II) chloride is formed during mixing. What is the concentration of Cl– (aq) in the mixture?","o":["0.33 M","0.50 M","0.75 M","1.50 M"],"a":0,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"A. 0.33 M Pb²⁺ (aq) + 2Cl⁻ (aq) → PbCl₂ (s) Number of moles of Pb²⁺ present = 0.50×(25/1000) = 0.0125 mol Number of moles of Cl⁻ present = 1.00×(50/1000) = 0.05mol As the mole ratio of Pb²⁺ to Cl⁻ is 1 to 2, Pb²⁺ (aq) is the limiting reagent. Number of moles of Cl⁻ (aq) left = 0.05 – 2(0.0125) = 0.025 mol Volume of the mixture = 25.00 + 50.00 = 75.00 cm³ Concentration of Cl⁻ (aq) = 0.025 / (75/1000) = 0.33 M","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/21/1A/5","p":75,"t":"15.0 cm³ of 0.20 M Ba(NO₃)₂(aq) is added to 25.0 cm³ of 0.10 M Na₂SO₄(aq). After the reaction is completed, which of the following ions has the highest concentration in the mixture?","o":["SO4 2– (aq)","NO3 – (aq)","Ba²⁺ (aq)","Na+ (aq)"],"a":1,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"B. NO₃⁻ (aq) Ba(NO₃)₂ (aq) + Na₂SO₄ (aq) → BaSO₄ (s) + 2NaNO₃ (aq) / Ba²⁺ (aq) + SO₄²⁻ (aq) → BaSO₄ (s) Ion Number of moles added (mol) Number of moles reacted (mol) Concentration in the mixture (M) SO₄²⁻ (aq) 0.10×25/1000 = 0.0025 0.0025 0 NO₃⁻ (aq) 2×0.20×15/1000 = 0.006 / 0.006 ÷ [(15+25)/1000] = 0.15 Ba²⁺ (aq) 0.20×15/1000 = 0.003 0.0025 (0.003 – 0.0025) ÷ (40/1000) = 0.0125 Na⁺ (aq) 2×0.10×25/1000 = 0.005 / 0.005 ÷ (40/1000) = 0.125","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/23/1A/22","p":25,"t":"Consider the following two solutions: Solution A : 100 cm³ of 1.0 M nitric acid Solution B : 100 cm³ of 0.5 M sulphuric acid Which of the following statements are correct? (1) Both solution A and solution B can react with iron. (2) Complete neutralisation of solution A and complete neutralisation of solution B require the same volume of 1.0 M potassium hydroxide solution. (3) When 0.05 mol of CaCO₃(s) is separately added to solution A and to solution B, the same number of moles of gas is evolved in both cases.","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":0,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"A. (1) and (2) only (3) CaCO₃ reacts with H₂SO₄ to give insoluble CaSO₄ . The CaSO₄ formed prevents further reaction of CaCO₃ with H₂SO₄ . The number of moles of gas evolved is smaller in this case.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/15/1A/8","p":88,"t":"In an experiment, 25.0 cm³ of HCl(aq) is measured with apparatus X and is placed in apparatus Y. The HCl(aq) in Y is then titrated with a standard NaOH(aq). Which of the following combinations is correct? X Y","o":["measuring cylinder beaker","measuring cylinder conical flask","pipette beaker","pipette conical flask"],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"A pipette measures and transfers the fixed 25.0 cm³ portion accurately. The acid is placed in a conical flask so the mixture can be swirled safely during titration. Therefore X is a pipette and Y is a conical flask.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/20/1A/16","p":86,"t":"The initial burette reading in a titration is 4.80 cm³ , and the corresponding final burette reading can be found from the diagram below: What is the volume of the reagent used in the titration?","o":["23.90 cm³","23.80 cm³","22.60 cm³","22.50 cm³"],"a":2,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"C. 22.60 cm³ Volume of the reagent used = 27.40 – 4.80 = 22.60 cm³","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option.","img":"q58","alt":"Final burette reading"},{"r":"DSE/19/1A/21","p":53,"t":"The diagram below shows a common glass apparatus: Which of the following statements concerning the transfer of an acid using this apparatus are INCORRECT? (1) The bulb should be firmly held in the hand when being filled with acid. (2) Exactly 20.00 cm³ of acid can be transferred using this apparatus. (3) The apparatus should first be rinsed by distilled water, then immediately followed by the transfer of acid.","o":["(1) and (2) only","(1) and (3) only","(2) and (3) only","(1), (2) and (3)"],"a":3,"k":"Test every statement against the relevant acid-base chemistry.","w":"D. (1), (2) and (3) (1) The bulb will be warmed by the hand and expand. Capacity increases and the volume of solution transferred will be larger than 25.00 cm³ . (2) 25.00 cm³ of acid can be transferred. (3) The apparatus should be rinsed by the acid to transfer after being rinsed by distilled water.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option.","img":"q59","alt":"Volumetric pipette with graduation mark and bulb"},{"r":"DSE/22/1A/4","p":80,"t":"Which of the following is an INCORRECT procedure in titration?","o":["Rinse the pipette with the solution to be delivered before titration.","Rinse the conical flask with the solution to be held before titration.","Take the burette readings with eyes on the same level as the meniscus.","Make sure that there are no air bubbles in the burette filled with the titrant."],"a":1,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"B. Rinse the conical flask with the solution to be held before titration. This increases the actual amount of the chemical species added as some of the solution will remain on the inner wall of the conical flask.","d":"The remaining choices use the wrong reaction condition, observation, species, apparatus rule or chemical property.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/24/1A/10","p":74,"t":"12.80 cm³ of a H₂SO₄(aq) sample is completely neutralised by 25.0 cm³ of 0.10 M KOH(aq). What is the concentration of the H₂SO₄(aq) sample?","o":["2.56 × 10⁻² M","9.77 × 10⁻² M","1.95 × 10⁻¹ M","3.91 × 10⁻¹ M"],"a":1,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"H₂SO₄(aq) + 2KOH(aq) → K₂SO₄(aq) + 2H₂O(l). Moles of KOH = 0.100 × 25.0/1000 = 2.50 × 10⁻³ mol, so moles of H₂SO₄ = 1.25 × 10⁻³ mol. Concentration = 1.25 × 10⁻³ ÷ 0.01280 = 9.77 × 10⁻² M.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/21/1A/16","p":66,"t":"A sample of sulphuric acid was completely neutralized by 25.0 cm³ of 0.200 M potassium hydroxide solution. The salt solution obtained was then made up to 100.0 cm³ with deionized water. What is the concentration of the resulting salt solution?","o":["0.0125 M","0.0250 M","0.0375 M","0.0500 M"],"a":1,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"B. 0.0250 M H₂SO₄ (aq) + 2KOH(aq) → K₂SO₄ (aq) + 2H₂O(l) Number of moles of KOH = 0.2 × 25/1000 = 0.005 mol Number of moles of K₂SO₄ = 0.005 ÷ 2 = 0.0025 mol Concentration = 0.0025 ÷ (100/1000) = 0.025 M","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/19/1A/4","p":83,"t":"25.00 cm³ of 0.051 M C₄H₄O₄(aq) can completely neutralize 22.18 cm³ of 0.115 M KOH(aq). What is the basicity of the acid C₄H₄O₄?","o":["1","2","3","4"],"a":1,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"B. 2 H n X(aq) + n KOH(aq) → K n X(aq) + n H₂O(l) Number of moles of KOH = 0.115 × 22.18/1000 = 2.5507×10⁻³ mol Number of moles of C₄H₄O₄ = 0.051 × 25.00/1000 = 1.275×10⁻³ mol n = 2.5507×10⁻³ / 1.275×10⁻³ = 2","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option."},{"r":"DSE/14/1A/12","p":48,"t":"In an experiment, standard HCl(aq) was added from a burette to a known volume of NaOH(aq) placed in an expanded polystyrene cup. The graph below shows the temperatures of the mixture in the cup during the process: What is the greatest temperature rise of the mixture in the cup as estimated from the graph above?","o":["2.0 °C","4.6 °C","6.2 °C","6.6 °C"],"a":3,"k":"Apply neutralisation stoichiometry and correct titration technique.","w":"D. 6.6 °C From the graph, greatest temperature rise = 32 – 25.4 = 6.6 °C","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option.","img":"q64","alt":"Temperature against volume graph"},{"r":"DSE/14/1A/7","p":32,"t":"Which of the following pairs of aqueous solutions, upon mixing, would have the lowest electrical conductivity?","o":["20.0 cm³ of 0.1 M HNO₃ and 20.0 cm³ of 0.1 M KOH","20.0 cm³ of 0.1 M H₂SO₄ and 20.0 cm³ of 0.1 M Ba(OH)₂","20.0 cm³ of 0.1 M CH₃COOH and 20.0 cm³ of 0.1 M NH₃","20.0 cm³ of 0.1 M HCl and 20.0 cm³ of 0.1 M C₆H₁₂O₆(glucose)"],"a":1,"k":"Test every statement against the relevant acid-base chemistry.","w":"Equal volumes of H₂SO₄(aq) and Ba(OH)₂(aq) react to form water and insoluble BaSO₄(s). Neutralisation removes H⁺ and OH⁻, while precipitation removes Ba²⁺ and SO₄²⁻, leaving the fewest mobile ions and therefore the lowest electrical conductivity.","d":"The remaining choices use the wrong reaction condition, observation, species, apparatus rule or chemical property.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/26/1A/8","p":null,"t":"Which of the following reaction routes is the most suitable for preparing zinc carbonate from zinc in school laboratories?","o":["Zn(s) —dilute HCl(aq)→ ZnCl₂(aq) —K₂CO₃(aq)→ ZnCO₃(s)","Zn(s) —dilute H₂SO₄(aq)→ ZnSO₄(aq) —CaCO₃(s)→ ZnCO₃(s)","Zn(s) —concentrated HNO₃(aq)→ Zn(NO₃)₂(aq) —Na₂CO₃(aq)→ ZnCO₃(s)","Zn(s) —O₂(g)→ ZnO(s) —CO₂(g)→ ZnCO₃(s)"],"a":0,"k":"Choose the salt-preparation method from solubility and reactivity.","w":"Zinc carbonate is insoluble, so it should be prepared by precipitation. Zinc first reacts safely with dilute hydrochloric acid to form soluble zinc chloride; adding aqueous potassium carbonate then precipitates ZnCO₃(s).","d":"The other routes conflict with solubility, metal reactivity, safety, or the required method for a soluble or insoluble salt.","tip":"Decide whether the product is soluble before choosing direct reaction, titration or precipitation.","img":"q66","alt":"Four reaction routes for preparing zinc carbonate"},{"r":"DSE/26/1A/16","p":null,"t":"In an experiment, 10.0 cm³ of 1.0 M NaOH(aq) is added to 10.0 cm³ of 1.0 M H₂SO₄(aq) containing a few drops of phenolphthalein. After the reaction is completed, which statements are correct? (1) Na⁺(aq), SO₄²⁻(aq), H⁺(aq) and OH⁻(aq) ions are present after mixing. (2) The mixture changes from colourless to pink. (3) The same temperature rise would occur if 20.0 cm³ of each solution were used instead.","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":2,"k":"Use the correct acid-base relationship, mole ratio and units.","w":"The mixture contains 0.010 mol NaOH and 0.010 mol H₂SO₄, so the acid remains in excess after neutralisation. H⁺ and OH⁻ are always present in aqueous solution, the phenolphthalein remains colourless, and doubling both volumes gives the same temperature rise because the reacting amounts and total heat capacity both double.","d":"The other choices result from an incorrect mole ratio, dilution factor, logarithm, limiting reagent or unit conversion.","tip":"Write the balanced equation first, convert all volumes to dm³, and check the limiting amount before selecting an option.","img":"q67","alt":"Sodium hydroxide added to sulphuric acid with phenolphthalein"},{"r":"DSE/26/1A/17","p":null,"t":"Which methods can separate Cu²⁺ from an aqueous solution containing Cu²⁺ and Al³⁺? (1) heating the mixture (2) adding excess NaOH(aq) to the mixture (3) adding Na₂SO₄(aq) to the mixture","o":["(1) only","(2) only","(1) and (3) only","(2) and (3) only"],"a":1,"k":"Apply solubility rules and qualitative-analysis observations.","w":"Excess NaOH(aq) precipitates both hydroxides initially, but amphoteric Al(OH)₃ dissolves in excess NaOH while Cu(OH)₂ remains as a solid. Filtering therefore separates Cu²⁺ as copper(II) hydroxide.","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"Check every word in each statement; one incorrect condition is enough to reject the whole option."},{"r":"DSE/26/1A/24","p":null,"t":"Consider the following statements and choose the best answer: 1st statement 2nd statement Concentrated hydrochloric acid and concentrated nitric acid cannot be distinguished by adding zinc metal to them. Both hydrochloric acid and nitric acid are strong acids.","o":["Both statements are true and the 2nd statement is a correct explanation of the 1st statement.","Both statements are true and the 2nd statement is NOT a correct explanation of the 1st statement.","The 1st statement is false but the 2nd statement is true.","Both statements are false."],"a":2,"k":"Apply solubility rules and qualitative-analysis observations.","w":"Zinc gives different observations with concentrated hydrochloric acid and concentrated nitric acid because concentrated nitric acid is oxidising. Both acids are strong, but their acid strength does not explain the different redox behaviour.","d":"The other choices predict an incorrect precipitate colour or solubility, or they fail to distinguish or separate the stated species.","tip":"State both the reagent and the observable result, including colour and behaviour in excess reagent."}];

const key='acids-bases-progress-v1';let current=0,state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}let selected=null;const el=id=>document.getElementById(id),saved=i=>state[i]||null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\n/g,'<br>');
function summary(){const done=Object.values(state).filter(v=>v&&v.checked),correct=done.filter(v=>v.selected===qs[v.index].a).length,pct=Math.round(done.length/qs.length*100);el('score').textContent=correct+'/'+done.length;el('progressText').textContent=pct+'% complete';el('progressBar').style.width=pct+'%'}
function nav(){el('questionNav').innerHTML=qs.map((q,i)=>{const s=saved(i);let c=i===current?'active ':'';if(s&&s.checked)c+=s.selected===q.a?'correct':'wrong';return '<button class="'+c.trim()+'" data-i="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>'}).join('');el('questionNav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function render(){const q=qs[current],s=saved(current);selected=s?s.selected:null;el('pageTitle').textContent='Question '+(current+1);el('questionCount').textContent=(current+1)+' of '+qs.length;el('sourceTag').textContent=q.r;el('difficultyTag').textContent=q.p===null?'New · 2026':(q.p>=75?'Easy · ':q.p>=55?'Medium · ':'Hard · ')+q.p+'% correct';el('questionTitle').innerHTML=fmt(q.t);el('questionExtra').innerHTML=q.img?'<div class="diagram"><img class="source-visual" src="'+img[q.img]+'" alt="'+esc(q.alt)+'"></div>':'';el('options').innerHTML=q.o.map((o,i)=>{let c='option';if(s&&s.checked)c+=i===q.a?' correct':i===s.selected?' wrong':'';else if(selected===i)c+=' chosen';return '<button class="'+c+'" data-i="'+i+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+fmt(o)+'</span></button>'}).join('');el('options').querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));el('checkButton').disabled=selected===null||!!(s&&s.checked);el('checkButton').textContent=s&&s.checked?'Answer checked':'Check answer';el('clearButton').disabled=selected===null||!!(s&&s.checked);el('previousButton').disabled=current===0;el('nextButton').disabled=current===qs.length-1;marking();nav();summary();window.scrollTo({top:0,behavior:'smooth'})}
function choose(i){selected=i;state[current]={index:current,selected:i,checked:false};localStorage.setItem(key,JSON.stringify(state));render()}function check(){if(selected===null)return;state[current]={index:current,selected,checked:true};localStorage.setItem(key,JSON.stringify(state));render()}function go(i){current=Math.max(0,Math.min(qs.length-1,i));render()}
function marking(){const q=qs[current],s=saved(current);if(!s||!s.checked){el('markingPanel').innerHTML='<div class="locked"><span>✓</span><h3>Detailed marking</h3><p>Select an option and check your answer to reveal the key principle, reasoning and distractor analysis.</p></div>';return}const ok=s.selected===q.a;el('markingPanel').innerHTML='<div class="explanation"><div class="answer-status '+(ok?'yes':'no')+'">'+(ok?'Correct · 1/1 mark':'Not correct · 0/1 mark')+'</div><p class="answer-label">CORRECT ANSWER · '+String.fromCharCode(65+q.a)+'</p><h3 class="result-title">'+fmt(q.k)+'</h3><h4>DETAILED MARKING</h4><p>'+fmt(q.w)+'</p><h4>DISTRACTOR ANALYSIS</h4><p>'+fmt(q.d)+'</p><div class="tip"><b>EXAM TIP</b><p>'+fmt(q.tip)+'</p></div></div>'}
el('checkButton').onclick=check;el('clearButton').onclick=()=>{delete state[current];localStorage.setItem(key,JSON.stringify(state));render()};el('previousButton').onclick=()=>go(current-1);el('nextButton').onclick=()=>go(current+1);el('resetButton').onclick=()=>{if(confirm('Reset all saved answers for Topic 04?')){state={};localStorage.removeItem(key);current=0;render()}};render();
