      {ref:'DSE/23/1A/1',difficulty:'Easy',stat:'85% of candidates correct',title:'Which of the following mixtures can be separated by filtration?',options:['a mixture of oil and water','a mixture of ethanol and water','a mixture of silver chloride and water','a mixture of sodium chloride and water'],answer:2,principle:'Filtration separates an insoluble solid from a liquid.',reason:'Silver chloride is insoluble in water, so it remains as the residue while water passes through the filter paper.',analysis:['A: Oil and water are immiscible liquids; use a separating funnel.','B: Ethanol and water are miscible liquids; use fractional distillation.','D: Sodium chloride is dissolved in water; obtain it by crystallisation.'],tip:'Ask whether the solid is insoluble before choosing filtration.'},
      {ref:'DSE/18/1A/1',difficulty:'Medium',stat:'56% of candidates correct',title:'Which of the following processes is most suitable for extracting sodium chloride from sea water?',options:['electrolysis','crystallisation','simple distillation','fractional distillation'],answer:1,principle:'A dissolved solid can be recovered from a solution by crystallisation.',reason:'Water is removed by evaporation until the solution becomes concentrated; cooling or further evaporation then forms sodium chloride crystals.',analysis:['A: Electrolysis of sea water produces hydrogen, chlorine and sodium hydroxide solution.','C: Simple distillation recovers pure water rather than sodium chloride crystals.','D: Fractional distillation separates miscible liquids with different boiling points.'],tip:'If the required product is the dissolved solute, think crystallisation rather than distillation.'},
      {ref:'DSE/24/1A/2',difficulty:'Easy',stat:'83% of candidates correct',title:'Which of the following methods can be used to directly obtain common salt from sea water?',options:['filtration','dissolution','electrolysis','crystallisation'],answer:3,principle:'Common salt is dissolved sodium chloride and is obtained directly by crystallisation.',reason:'Evaporating water concentrates the sea water and allows sodium chloride crystals to form.',analysis:['A: Filtration cannot remove dissolved sodium chloride.','B: Dissolution means dissolving a solute in a solvent; it does not recover the salt.','C: Electrolysis changes the substances present and does not directly yield common salt.'],tip:'“Directly obtain” rules out processes that chemically change the salt.'},
      {ref:'DSE/16/1A/19',difficulty:'Hard',stat:'27% of candidates correct',title:'The hazard warning label below is displayed on a bottle containing chemical Z. Which of the following chemicals may Z be?',extra:'<img class="visual" src="'+pictogram+'" alt="Corrosive hazard warning pictogram"><div class="statements"><p>(1) sodium</p><p>(2) trichloromethane</p><p>(3) concentrated aqueous ammonia</p></div>',options:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],answer:2,principle:'The pictogram warns that the substance is corrosive to skin, eyes or materials.',reason:'Sodium reacts vigorously with moisture and can cause severe burns. Concentrated aqueous ammonia is corrosive. Trichloromethane is harmful but is not classified by this corrosive pictogram in this context.',analysis:['(1) is included because sodium forms corrosive sodium hydroxide on contact with water.','(2) is excluded because trichloromethane is associated with harmful health effects rather than this corrosive warning.','(3) is included because concentrated aqueous ammonia can cause severe chemical burns.'],tip:'Identify the hazard shown before testing each listed substance.'},
      {ref:'DSE/16/1A/1',difficulty:'Easy',stat:'81% of candidates correct',title:'A flame test conducted for a sample gives a brick-red flame. The sample may contain',options:['chalk.','quartz.','graphite.','rock salt.'],answer:0,principle:'Calcium ions give a brick-red flame in a flame test.',reason:'Chalk consists mainly of calcium carbonate, CaCO₃, and therefore contains calcium ions.',analysis:['B: Quartz is mainly silicon dioxide.','C: Graphite is carbon.','D: Rock salt is mainly sodium chloride; sodium gives a golden-yellow flame.'],tip:'Memorise: calcium - brick red; sodium - golden yellow; potassium - lilac.'},
      {ref:'DSE/17/1A/19',difficulty:'Medium',stat:'60% of candidates correct',title:'Which of the following statements concerning anhydrous copper(II) sulphate powder are correct?',extra:'<div class="statements"><p>(1) It is white in colour.</p><p>(2) It dissolves in water to give a blue solution.</p><p>(3) It can be obtained from heating hydrated copper(II) sulphate crystals.</p></div>',options:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],answer:3,principle:'Anhydrous copper(II) sulphate is white and becomes hydrated in the presence of water.',reason:'All three statements are correct: the anhydrous solid is white, aqueous copper(II) ions form a blue solution, and heating hydrated crystals removes water of crystallisation.',analysis:['(1) true: anhydrous CuSO₄ is white.','(2) true: it dissolves to form a blue Cu²⁺(aq) solution.','(3) true: heating CuSO₄·5H₂O removes water and leaves CuSO₄.'],tip:'Do not confuse white anhydrous CuSO₄ with blue hydrated CuSO₄·5H₂O.'},
      {ref:'DSE/22/1A/1',difficulty:'Easy',stat:'72% of candidates correct',title:'Which of the following statements concerning CO₂(g) is INCORRECT?',options:['It can turn lime water milky.','It can be used to make dry ice.','It can be produced by adding marble to water.','It generally has a higher percentage in air in urban areas than that in rural areas.'],answer:2,principle:'Marble is calcium carbonate and does not release carbon dioxide when added to water.',reason:'Carbon dioxide is produced when calcium carbonate reacts with an acid, not with water alone.',equation:'CaCO₃(s) + 2H⁺(aq) → Ca²⁺(aq) + CO₂(g) + H₂O(l)',analysis:['A is correct: CO₂ forms a milky CaCO₃ precipitate with lime water.','B is correct: dry ice is solid carbon dioxide.','D is correct: combustion and traffic can raise urban CO₂ levels.'],tip:'Carbonates need acid to release carbon dioxide.'},
      {ref:'DSE/25/1A/3',difficulty:'Easy',stat:'80% of candidates correct',title:'Which of the following statements is INCORRECT?',options:['Calcium carbonate solid can be obtained from passing carbon dioxide gas into lime water.','Calcium hydroxide solid can be obtained directly from strong heating of marble.','Hydrogen gas can be obtained directly from electrolysis of sea water.','Nitrogen gas can be obtained from fractional distillation of liquefied air.'],answer:1,principle:'Strong heating of marble produces calcium oxide, not calcium hydroxide.',reason:'Marble is calcium carbonate. Thermal decomposition gives quicklime, CaO. Calcium hydroxide is formed only after CaO reacts with water.',equation:'CaCO₃(s) → CaO(s) + CO₂(g);  CaO(s) + H₂O(l) → Ca(OH)₂(s)',analysis:['A is correct: limited CO₂ passed into lime water forms CaCO₃.','C is correct: water is reduced at the cathode to form hydrogen during electrolysis of sea water.','D is correct: nitrogen is separated from liquefied air by fractional distillation.'],tip:'Strong heating: limestone → quicklime. Adding water: quicklime → slaked lime.'},
      {ref:'DSE/18/1A/19',difficulty:'Medium',stat:'68% of candidates correct',title:'In an experiment, marble is heated in a boiling tube and the gas evolved is passed into a test tube with lime water. Which of the following statements concerning the experiment is / are correct?',extra:'<div class="statements"><p>(1) The marble turns brick red upon heating.</p><p>(2) The lime water turns milky initially but eventually becomes a colourless solution.</p><p>(3) If marble is replaced by chalk, a similar observation would be obtained.</p></div>',options:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],answer:3,principle:'Both marble and chalk contain calcium carbonate and give carbon dioxide on strong heating.',reason:'Statement (1) is false: marble does not burn with a brick-red flame merely because it is heated. Statement (2) is true because excess CO₂ converts insoluble CaCO₃ into soluble calcium hydrogencarbonate. Statement (3) is true because chalk is also mainly CaCO₃.',equation:'CaCO₃(s) + CO₂(g) + H₂O(l) → Ca(HCO₃)₂(aq)',analysis:['(1) false.','(2) true: milky first, then colourless with excess CO₂.','(3) true: chalk and marble have the same main chemical constituent.'],tip:'Distinguish heating a calcium compound from conducting a flame test.'},
      {ref:'DSE/20/1A/1',difficulty:'Hard',stat:'42% of candidates correct',title:'Which of the following statements concerning quicklime is INCORRECT?',options:['Heating marble strongly can form quicklime.','Reacting quicklime with sulphur dioxide can form calcium sulphate.','Reacting quicklime with carbon dioxide can form calcium carbonate.','A large amount of heat evolves when quicklime is put into water.'],answer:1,principle:'Quicklime is calcium oxide, CaO.',reason:'Calcium oxide reacts with sulphur dioxide to form calcium sulphite, CaSO₃, not calcium sulphate, CaSO₄.',equation:'CaO(s) + SO₂(g) → CaSO₃(s)',analysis:['A is correct: CaCO₃ decomposes to CaO and CO₂.','C is correct: CaO + CO₂ → CaCO₃.','D is correct: hydration of CaO is strongly exothermic.'],tip:'SO₂ commonly gives sulphite; oxidation is needed to form sulphate.'},
      {ref:'DSE/25/1A/2',difficulty:'Easy',stat:'91% of candidates correct',title:'A white solid X gives a brick-red flame in a flame test. When X(s) is added to dilute hydrochloric acid, a colourless gas is given out. Which of the following compounds may X be?',options:['calcium sulphate','potassium sulphate','calcium carbonate','potassium carbonate'],answer:2,principle:'Brick red identifies calcium ions; effervescence with acid identifies carbonate ions.',reason:'Calcium carbonate contains both Ca²⁺ and CO₃²⁻. The gas is carbon dioxide.',equation:'CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + CO₂(g) + H₂O(l)',analysis:['A contains calcium but sulphate does not release a gas with dilute HCl.','B contains neither the calcium flame colour nor carbonate.','D contains carbonate, but potassium gives a lilac flame.'],tip:'Combine both test results; do not use only one observation.'},
      {ref:'DSE/24/1A/20',difficulty:'Medium',stat:'51% of candidates correct',title:'Which of the following processes can be used to distinguish between K₂CO₃(aq) and CaCl₂(aq)?',extra:'<div class="statements"><p>(1) performing a flame test</p><p>(2) adding dilute hydrochloric acid</p><p>(3) adding acidified silver nitrate solution</p></div>',options:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],answer:3,principle:'A valid distinguishing test must give different observations for the two solutions.',reason:'All three work: K⁺ gives a lilac flame while Ca²⁺ gives brick red; carbonate effervesces with acid while calcium chloride does not; after acidification, chloride gives a white AgCl precipitate while carbonate is removed as CO₂.',analysis:['(1): lilac versus brick-red flame.','(2): effervescence for K₂CO₃; no observable change for CaCl₂.','(3): no precipitate for acidified K₂CO₃; white AgCl for CaCl₂.'],tip:'For acidified silver nitrate, acid removes carbonate interference before testing chloride.'},
      {ref:'DSE/15/1A/23',difficulty:'Medium',stat:'53% of candidates correct',title:'Which of the following can distinguish a sample of limestone powder from a sample of table salt?',extra:'<div class="statements"><p>(1) adding water</p><p>(2) performing a flame test</p><p>(3) adding dilute hydrochloric acid</p></div>',options:['(1) and (2) only','(1) and (3) only','(2) and (3) only','(1), (2) and (3)'],answer:3,principle:'Limestone is mainly CaCO₃; table salt is mainly NaCl.',reason:'All three tests distinguish them: limestone is insoluble while table salt dissolves; calcium gives brick red while sodium gives golden yellow; limestone effervesces with acid while table salt shows no observable change.',analysis:['(1): insoluble limestone versus soluble table salt.','(2): brick-red calcium flame versus golden-yellow sodium flame.','(3): CO₂ bubbles from limestone versus no visible reaction for table salt.'],tip:'State both observations whenever a question asks how to distinguish two substances.'},
      {ref:'DSE/26/1A/13',difficulty:'Medium',stat:'2026 question',title:'Which of the following statements about limestone powder and quicklime powder is / are correct?',extra:'<div class="statements"><p>(1) Both of them react with dilute hydrochloric acid to give salt and water only.</p><p>(2) Both of them give a brick-red flame in flame test.</p><p>(3) Both of them give a colourless gas when heated strongly.</p></div>',options:['(1) only','(2) only','(1) and (3) only','(2) and (3) only'],answer:1,principle:'Limestone is CaCO₃ and quicklime is CaO.',reason:'Only statement (2) is correct. Both contain calcium and give a brick-red flame. Limestone also gives CO₂ when reacting with hydrochloric acid, so statement (1) is false. Limestone releases CO₂ on strong heating, but quicklime does not, so statement (3) is false.',equation:'CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + CO₂(g) + H₂O(l)',analysis:['(1) false: limestone does not give salt and water only.','(2) true: both contain calcium.','(3) false: only limestone gives CO₂ on strong heating.'],tip:'Compare CaCO₃ and CaO separately for each statement.'}
    ];
    const key='planet-earth-progress-v1';let current=0;let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){state={}}let selected=null;
    const el=id=>document.getElementById(id);
    function saved(i){return state[i]||null}
    function updateSummary(){const entries=Object.values(state).filter(v=>v&&v.checked);const correct=entries.filter(v=>v.selected===questions[v.index].answer).length;el('score').textContent=correct+'/'+entries.length;const pct=Math.round(entries.length/questions.length*100);el('progressText').textContent=pct+'% complete';el('progressBar').style.width=pct+'%'}
    function renderNav(){el('questionNav').innerHTML=questions.map((q,i)=>{const s=saved(i);let cls=i===current?'active ':'';if(s&&s.checked)cls+=s.selected===q.answer?'correct':'wrong';return '<button class="'+cls.trim()+'" data-index="'+i+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>'}).join('');el('questionNav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.index))))}
    function render(){const q=questions[current],s=saved(current);selected=s?s.selected:null;el('pageTitle').textContent='Question '+(current+1);el('questionCount').textContent=(current+1)+' of '+questions.length;el('sourceTag').textContent=q.ref;el('difficultyTag').textContent=q.difficulty+' · '+q.stat;el('questionTitle').innerHTML=q.title;el('questionExtra').innerHTML=q.extra||'';el('options').innerHTML=q.options.map((o,i)=>{let cls='option';if(s&&s.checked)cls+=i===q.answer?' correct':i===s.selected?' wrong':'';else if(selected===i)cls+=' chosen';return '<button class="'+cls+'" data-index="'+i+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+o+'</span></button>'}).join('');el('options').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.index))));el('checkButton').disabled=selected===null||Boolean(s&&s.checked);el('checkButton').textContent=s&&s.checked?'Answer checked':'Check answer';el('clearButton').disabled=selected===null||Boolean(s&&s.checked);el('previousButton').disabled=current===0;el('nextButton').disabled=current===questions.length-1;renderMarking();renderNav();updateSummary();window.scrollTo({top:0,behavior:'smooth'})}
    function choose(i){selected=i;state[current]={index:current,selected:i,checked:false};localStorage.setItem(key,JSON.stringify(state));render()}
    function check(){if(selected===null)return;state[current]={index:current,selected,checked:true};localStorage.setItem(key,JSON.stringify(state));render()}
    function clearChoice(){delete state[current];selected=null;localStorage.setItem(key,JSON.stringify(state));render()}
    function go(i){current=Math.max(0,Math.min(questions.length-1,i));render()}
    function renderMarking(){const q=questions[current],s=saved(current);if(!s||!s.checked){el('markingPanel').innerHTML='<div class="locked"><span>✓</span><h3>Detailed marking</h3><p>Select an option and check your answer to reveal the key principle, reasoning and distractor analysis.</p></div>';return}const ok=s.selected===q.answer;const list=q.analysis.map(a=>'<li>'+a+'</li>').join('');el('markingPanel').innerHTML='<div class="explanation"><div class="answer-status '+(ok?'yes':'no')+'">'+(ok?'Correct · 1/1 mark':'Not correct · 0/1 mark')+'</div><p class="answer-label">CORRECT ANSWER · '+String.fromCharCode(65+q.answer)+'</p><h3 class="result-title">'+q.principle+'</h3><h4>REASONING</h4><p>'+q.reason+'</p>'+(q.equation?'<div class="equation">'+q.equation+'</div>':'')+'<h4>OPTION ANALYSIS</h4><ul>'+list+'</ul><div class="tip"><b>EXAM TIP</b><p>'+q.tip+'</p></div></div>'}
    el('checkButton').addEventListener('click',check);el('clearButton').addEventListener('click',clearChoice);el('previousButton').addEventListener('click',()=>go(current-1));el('nextButton').addEventListener('click',()=>go(current+1));el('resetButton').addEventListener('click',()=>{if(confirm('Reset all saved answers for Topic 01?')){state={};localStorage.removeItem(key);current=0;render()}});render();
  </script>
